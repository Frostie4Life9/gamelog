<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A33">
<title>Game Log</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261021a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261021a">
<link rel="manifest" href="site.webmanifest?v=20261021a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#161A33; --deep:#1F2547; --raise:#2A3160; --line:#363E70; --line-soft:#2B3260;
  --paper:#ECEEFB; --mist:#A1A8D0; --dim:#7A82B0;
  --gold:#F5B63F; --gold-ink:#2A1D05; --mint:#62D6B8; --rose:#F0798A; --sky:#8FB8FF;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --font:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --rail:248px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--night);color:var(--paper);font:400 16px/1.5 var(--font);font-variation-settings:'opsz' 16;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--gold-ink)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:28px;background:linear-gradient(180deg,#1A1F3E,var(--night))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-size:20px;font-weight:800;font-variation-settings:'wdth' 80,'opsz' 48;letter-spacing:-.01em}
.navlist{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--mist);font-weight:500;text-align:left}
.navbtn:hover{background:var(--deep);color:var(--paper)}
.navbtn.on{background:var(--deep);color:var(--paper)}
.navbtn.on svg{color:var(--gold)}
.navbtn .count{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.rail-sub{font-size:13px;color:var(--dim);padding:0 12px;margin:0 0 8px}
.rail-up{display:flex;flex-direction:column;gap:2px}
.rail-up button{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:0;background:transparent;padding:8px 12px;border-radius:var(--r-sm);text-align:left;color:var(--paper)}
.rail-up button:hover{background:var(--deep)}
.rail-up .d{font-weight:800;font-size:20px;line-height:1;font-variation-settings:'wdth' 75;color:var(--gold);text-align:center}
.rail-up .d small{display:block;font-size:11px;font-weight:500;color:var(--dim);margin-top:2px}
.rail-up .n{font-size:14px;line-height:1.3}
.rail-up .n span{display:block;color:var(--dim);font-size:12px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.rail-foot button{border:0;background:transparent;color:var(--dim);text-align:left;padding:6px 12px;border-radius:var(--r-sm);font-size:14px}
.rail-foot button:hover{color:var(--paper);background:var(--deep)}
.rail-foot .syncbtn.on{background:var(--deep);color:var(--paper)}
.dot{display:inline-flex;align-items:center;gap:8px}
.dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot[data-state=ok]::before{background:var(--mint)}
.dot[data-state=syncing]::before{background:var(--gold)}
.dot[data-state=error]::before{background:var(--rose)}
.syncpage{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
.syncpage .panel{display:flex;flex-direction:column;gap:16px}
.syncpage p{margin:0;color:var(--mist);max-width:60ch}
.err{color:var(--rose);font-size:14px;min-height:1em}
.steamstat{font-size:14px;color:var(--mist);margin:10px 0 0;line-height:1.5}
.artpick{margin-top:4px;display:flex;flex-direction:column;gap:12px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.artgrid button{border:2px solid transparent;border-radius:var(--r-sm);padding:0;background:var(--night);overflow:hidden;text-align:left;color:var(--paper)}
.artgrid button:hover{border-color:var(--gold)}
.artgrid img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--raise)}
.artgrid span{display:block;font-size:12px;line-height:1.3;padding:6px 6px 8px}
@media (max-width:760px){.syncpage{grid-template-columns:1fr}}

main{min-width:0;padding:40px clamp(18px,4vw,56px) 80px}
.page{max-width:1080px;margin:0 auto}
.tabbar{display:none}

/* Type */
.h1{font-size:clamp(30px,4vw,44px);line-height:1.05;font-weight:800;font-variation-settings:'wdth' 82,'opsz' 72;letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--mist);margin:0 0 32px;max-width:60ch}
.h2{font-size:20px;font-weight:700;font-variation-settings:'wdth' 90,'opsz' 32;margin:0 0 14px;letter-spacing:-.005em}
.muted{color:var(--mist)} .dim{color:var(--dim)}

/* Covers */
.cover{position:relative;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;isolation:isolate;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -18px rgba(0,0,0,.6);background-color:var(--raise)}
.cover .ct{position:absolute;inset:auto 14px 16px 14px;font-weight:800;font-variation-settings:'wdth' 75,'opsz' 96;line-height:.92;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.35);z-index:2}
.cover .spine{position:absolute;top:0;bottom:0;left:0;width:6px;background:rgba(255,255,255,.18);z-index:2}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);z-index:3}
.cover .bar i{display:block;height:100%;background:var(--gold)}
.cover .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover.wide .art{object-position:center;filter:saturate(1.05)}
.cover.img .ct,.cover.img .spine{display:none}

/* Continue screen */
.feature{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:clamp(20px,3vw,40px);background:var(--deep);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,28px);margin-bottom:44px}
.feature .cover .ct{font-size:clamp(30px,3.4vw,44px)}
.feature h2{font-size:clamp(26px,3vw,36px);line-height:1.05;font-weight:800;font-variation-settings:'wdth' 82,'opsz' 72;letter-spacing:-.015em;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--mist);font-size:14px;margin-bottom:20px}
.meta .alert{color:var(--rose)}
.save{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.save div{border-left:3px solid var(--line);padding:2px 0 2px 14px}
.save div.next{border-left-color:var(--gold)}
.save h4{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--dim)}
.save p{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap}
.upnext h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--dim)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.slot{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.slot .cover{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.slot:hover .cover{transform:translateY(-4px)}
.slot .cover .ct{font-size:clamp(22px,2.3vw,28px)}
.slot .lbl{font-size:15px;font-weight:600;line-height:1.25}
.slot .sub{font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center}
.score{position:absolute;bottom:12px;right:10px;z-index:3;min-width:34px;height:34px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:rgba(22,26,51,.82);backdrop-filter:blur(6px);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--gold)}

.timeline{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.tl{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line-soft);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;width:100%}
.tl:hover{background:rgba(42,49,96,.35)}
.tl .day{font-weight:800;font-size:32px;line-height:.9;font-variation-settings:'wdth' 75;color:var(--paper)}
.tl .day small{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:4px}
.tl .what b{display:block;font-weight:600}
.tl .what span{color:var(--mist);font-size:14px}
.tl .cd{font-size:14px;color:var(--gold);font-weight:600;white-space:nowrap}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--gold);color:var(--gold-ink)}
.btn:hover{filter:brightness(1.06)}
.btn.quiet{background:var(--raise);color:var(--paper)}
.btn.quiet:hover{background:var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid rgba(240,121,138,.45)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.play{text-decoration:none}
.btn.play svg{width:14px;height:14px;fill:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--dim);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],input[type=password],select,textarea{width:100%;background:var(--night);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,182,63,.18)}
textarea{resize:vertical;min-height:110px;line-height:1.55}
::placeholder{color:var(--dim)}
.seg{display:inline-flex;background:var(--deep);border:1px solid var(--line-soft);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mist);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500}
.seg button.on{background:var(--paper);color:var(--night);font-weight:700}
.seg button .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* Checklist */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.tick{appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--line);border-radius:7px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--mist)}
.tick:checked{background:var(--mint);border-color:var(--mint)}
.tick:checked::after{content:'';width:10px;height:6px;border-left:2.5px solid var(--night);border-bottom:2.5px solid var(--night);transform:translateY(-1px) rotate(-45deg)}
.checks li.done .t{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line)}
.checks .t{line-height:1.45}
.rm{border:0;background:transparent;color:var(--dim);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.checks li:hover .rm,.rm:focus-visible{opacity:1}
.rm:hover{color:var(--rose);background:var(--raise)}
@media (hover:none){.rm{opacity:.7}}
.adder{display:flex;gap:8px;margin-top:12px}
.adder input{flex:1}
.adder button{flex:none}

/* Library */
.libhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.libtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px}
.libtools .search{flex:1;min-width:180px;max-width:320px}
.libtools select{width:auto}
.addgame{display:flex;flex-wrap:wrap;gap:8px;min-width:min(100%,360px)}
.addgame input{flex:1 1 180px}
.btn:disabled{opacity:.55;cursor:default}
/* Achievements */
.achsum{display:grid;grid-template-columns:auto 1fr;gap:20px 32px;align-items:center;margin-bottom:24px}
.achsum .big{font-weight:800;font-size:44px;line-height:.9;font-variation-settings:'wdth' 75;font-variant-numeric:tabular-nums}
.achsum .big small{font-size:20px;color:var(--dim);font-weight:600}
.achsum .meter{height:8px;border-radius:999px;background:var(--raise);overflow:hidden;margin-bottom:10px}
.achsum .meter i{display:block;height:100%;background:var(--gold);border-radius:inherit}
.achsum p{margin:0;color:var(--mist);font-size:14px}
.achtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.achtools select{width:auto}
.achtools .grow{flex:1}
.achlist{list-style:none;margin:0;padding:0}
.achlist li{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.achlist img{width:48px;height:48px;border-radius:8px;background:var(--raise);display:block}
.achlist li.locked img{filter:grayscale(1) brightness(.6)}
.achlist b{display:block;font-weight:600}
.achlist .d{color:var(--mist);font-size:14px}
.achlist .r{text-align:right;font-size:13px;color:var(--dim);white-space:nowrap}
.achlist .r b{font-size:15px;color:var(--paper);font-variant-numeric:tabular-nums}
.achlist .r .rare{color:var(--gold)}
.achlist .reveal{border:0;background:none;color:var(--gold);padding:0;font-size:14px;cursor:pointer}
.achlast{margin:0 0 24px;color:var(--mist);font-size:14px}
.achlast b{color:var(--paper)}
.achchip{display:inline-flex;align-items:center;gap:4px}
.slot .sub{flex-wrap:wrap}
.newtag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:var(--gold-ink);background:var(--gold);padding:4px 8px;border-radius:999px;border:0;white-space:nowrap}
button.newtag{cursor:pointer}
.sec .n.new{background:var(--gold);color:var(--gold-ink)}
.newshead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.newsctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.newsnote{margin:4px 0 0;font-size:14px;color:var(--mist)}
.newsnote b{color:var(--gold)} .newsnote .warnt{color:var(--rose)}
.posts{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px 18px;background:var(--night)}
.post.fresh{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.post .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-bottom:6px}
.post .kind{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--raise);color:var(--mist)}
.post .kind.patch{background:rgba(143,184,255,.16);color:var(--sky)}
.post h3{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:-.003em}
.post h3 a{color:var(--paper);text-decoration:none} .post h3 a:hover{color:var(--gold);text-decoration:underline}
.post .ex{margin:0 0 8px;color:var(--mist);font-size:14.5px;white-space:pre-line}
.post .more{font-size:14px}
/* Store page */
.store{display:flex;flex-direction:column;gap:20px}
.store-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(18px,3vw,32px)}
.store-lead{margin:0 0 18px;font-size:17px;line-height:1.55;color:var(--paper)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.facts div{min-width:0} .facts dt{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
.facts dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.scores{display:flex;flex-direction:column;gap:10px}
.scorecard{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--night);color:inherit;text-decoration:none}
a.scorecard:hover{border-color:var(--line)}
.scorecard .v{font-weight:800;font-size:26px;line-height:1;font-variation-settings:'wdth' 80;text-align:center;font-variant-numeric:tabular-nums}
.scorecard .l b{display:block;font-size:15px} .scorecard .l span{font-size:13px;color:var(--dim)}
.scorecard .v.good{color:var(--mint)} .scorecard .v.mid{color:var(--gold)} .scorecard .v.bad{color:var(--rose)}
.scorecard .v s{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.store-links .btn{text-decoration:none}
.store-links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--raise);color:var(--mist)}
.chips.genre span{background:rgba(245,182,63,.14);color:var(--gold)}
.media{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -4px;padding-left:4px}
.media>*{flex:none;scroll-snap-align:start;border-radius:var(--r-sm);overflow:hidden;background:var(--night);border:1px solid var(--line-soft)}
.media video{width:min(560px,82vw);aspect-ratio:16/9;display:block;background:#000}
.media .vid{display:block;width:min(560px,82vw);aspect-ratio:16/9;position:relative;padding:0;cursor:pointer;color:inherit;font:inherit}
.media .vid img{width:100%;height:100%;object-fit:cover;display:block}
.media .vid .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 50%,rgba(0,0,0,.6));color:#fff;font-weight:700;font-size:15px;padding:0 12px;text-align:center}
.media .vid:hover .play{background:linear-gradient(transparent 30%,rgba(0,0,0,.7))}
.media a{display:block;width:min(320px,70vw);aspect-ratio:16/9;position:relative}
.media a img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.media a:hover img{transform:scale(1.03)}
.media a .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 50%,rgba(0,0,0,.55));color:#fff;font-weight:700;font-size:14px}
.about{white-space:pre-line;color:var(--mist);font-size:15px;line-height:1.6;margin:0}
.about-wrap{position:relative;max-height:230px;overflow:hidden}
.about-wrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,var(--deep))}
.about-wrap.open{max-height:none} .about-wrap.open::after{display:none}
.dlc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.dlc li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.dlc .nm{font-weight:600;min-width:0} .dlc .nm small{display:block;font-weight:400;font-size:13px;color:var(--dim)}
.dlc .nm small.soon{color:var(--gold)}
.dlc .pr{font-size:14px;color:var(--mist);white-space:nowrap;font-variant-numeric:tabular-nums}
.dlc .trk{font-size:13px;color:var(--mint);white-space:nowrap}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.reqs h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.reqs dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.reqs dt{color:var(--dim)} .reqs dd{margin:0;overflow-wrap:anywhere}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.subhead .h2{margin:0}
@media (max-width:900px){.store-top,.reqs{grid-template-columns:1fr}}
@media (max-width:520px){.facts{grid-template-columns:1fr}.dlc li{grid-template-columns:1fr auto}.dlc .trkcell{grid-column:1/-1}}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:48px 24px;text-align:center;color:var(--mist)}
.empty b{display:block;color:var(--paper);font-size:18px;margin-bottom:6px}

/* Game page */

<script>
/* suite motion helpers (window.SX), shared by every app. Each one is a
   no-op extra: if the browser can't animate or you've asked for reduced
   motion, the change just happens, exactly as it did before.
     SX.flip(root, sel, change)  redraw a list and let the items that stay
                                 glide to their new spots; new ones fade in
     SX.enter(root, sel, dir)    play a short staggered entrance on fresh content
     SX.pill(row, activeSel)     slide a highlight to the selected tab/chip
     SX.expand(el, open, apply)  open or close a block by its height
     SX.morph(root, sel, prop, change)  bars and meters ease to their new size
     SX.bump(el)                 a small pop for a value that just changed */
(function(){
  if(window.SX) return;
  var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  var E='cubic-bezier(.2,.8,.2,1)', SPRING='cubic-bezier(.3,1.25,.5,1)';
  function still(){ return !!(mq&&mq.matches) || typeof Element.prototype.animate!=='function'; }
  function q(x){ return typeof x==='string'?document.querySelector(x):x; }
  function keyOf(el,kf){ return kf?kf(el):(el.getAttribute('data-sx-key')||el.getAttribute('data-id')||el.getAttribute('data-k')||el.id||null); }
  function quietCss(el){ /* a redraw should not replay an entrance the item already did */
    try{ el.getAnimations({subtree:true}).forEach(function(a){ if(a.animationName) a.cancel(); }); }catch(e){} }

  function flip(root,sel,change,o){
    o=o||{}; root=q(root);
    if(!root || still()){ change(); return; }
    var before={}, vh=window.innerHeight;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || before[k]) return;
      var r=el.getBoundingClientRect(); if(!r.width && !r.height) return;
      before[k]=r;
    });
    change();
    var seen={}, n=0;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || seen[k]) return; seen[k]=1;
      var b=before[k], r=el.getBoundingClientRect();
      if(!r.width && !r.height) return;
      if(r.bottom<-40 || r.top>vh+40){ if(b) quietCss(el); return; }
      if(b){
        quietCss(el);
        var dx=b.left-r.left, dy=b.top-r.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        if(Math.abs(dy)>vh) dy=dy>0?vh*.5:-vh*.5;
        el.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:o.dur||340,easing:E});
      } else if(o.enter!==false){
        quietCss(el);
        el.animate([{opacity:0,translate:'0 6px',scale:.985},{opacity:1,translate:'0 0',scale:1}],
                   {duration:260,delay:Math.min(n++,8)*24,easing:E,fill:'backwards'});
      }
    });
  }

  function enter(root,sel,dir,o){
    o=o||{}; root=q(root); if(!root || still()) return;
    var els=sel?root.querySelectorAll(sel):root.children, vh=window.innerHeight, i=0;
    var from=dir==='left'?'-18px 0':dir==='right'?'18px 0':dir==='none'?'0 0':'0 8px';
    Array.prototype.forEach.call(els,function(el){
      if(el.classList && el.classList.contains('sx-pill')) return;
      var r=el.getBoundingClientRect(); if(r.bottom<0 || r.top>vh || !r.height) return;
      quietCss(el);
      el.animate([{opacity:0,translate:from},{opacity:1,translate:'0 0'}],
                 {duration:o.dur||300,delay:Math.min(i++,10)*(o.step==null?30:o.step),easing:E,fill:'backwards'});
    });
  }

  var rows=[];
  function pill(row,activeSel,o){
    row=q(row); if(!row) return;
    var rec=null; rows.forEach(function(x){ if(x.row===row) rec=x; });
    if(!rec){ rec={row:row, sel:activeSel, last:null, o:o||{}}; rows.push(rec); watch(rec); }
    rec.sel=activeSel||rec.sel; place(rec,true);
  }
  function place(rec,animate){
    var row=rec.row, p=row.querySelector(':scope > .sx-pill');
    if(!p){ p=document.createElement('span'); p.className='sx-pill'+(rec.o.cls?' '+rec.o.cls:''); p.setAttribute('aria-hidden','true'); row.insertBefore(p,row.firstChild); }
    if(!row.classList.contains('sx-pilled')){ row.classList.add('sx-pilled');
      if(getComputedStyle(row).position==='static') row.style.position='relative'; }
    var a=row.querySelector(rec.sel);
    if(!a || !a.offsetWidth){ p.style.opacity='0'; rec.last=null; return; }
    var now={x:a.offsetLeft, y:a.offsetTop, w:a.offsetWidth, h:a.offsetHeight}, last=rec.last;
    rec.last=now;
    p.style.opacity='1'; p.style.width=now.w+'px'; p.style.height=now.h+'px';
    p.style.transform='translate('+now.x+'px,'+now.y+'px)';
    if(animate && last && !still() && (last.x!==now.x || last.y!==now.y || last.w!==now.w)){
      p.animate([{transform:'translate('+last.x+'px,'+last.y+'px)',width:last.w+'px',height:last.h+'px'},
                 {transform:'translate('+now.x+'px,'+now.y+'px)',width:now.w+'px',height:now.h+'px'}],
                {duration:360,easing:SPRING});
    }
  }
  function watch(rec){ if(window.ResizeObserver){ new ResizeObserver(function(){ place(rec,false); }).observe(rec.row); } }
  window.addEventListener('resize',function(){ rows.forEach(function(r){ place(r,false); }); });

  function expand(el,open,apply){
    el=q(el); if(!el){ apply(open); return; }
    if(el._sx){ el._sx.cancel(); el._sx=null; }
    if(still()){ apply(open); return; }
    var cs, h, f, a;
    if(open){
      apply(true); cs=getComputedStyle(el); h=el.offsetHeight; if(!h) return;
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0},f],{duration:300,easing:E});
    } else {
      cs=getComputedStyle(el); h=el.offsetHeight; if(!h){ apply(false); return; }
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([f,{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0}],{duration:240,easing:E});
    }
    el._sx=a;
    a.onfinish=function(){ el._sx=null; el.style.overflow=''; if(!open) apply(false); };
    a.oncancel=function(){ el.style.overflow=''; };
  }

  /* redraw something whose bars or meters are set inline (width:40%), and
     let each one ease from where it was instead of snapping */
  function morph(host,sel,prop,change){
    host=q(host); if(!host){ change(); return; }
    var old=Array.prototype.map.call(host.querySelectorAll(sel),function(e){ return e.style[prop]; });
    change();
    if(still()) return;
    var now=host.querySelectorAll(sel), to=Array.prototype.map.call(now,function(e){ return e.style[prop]; });
    Array.prototype.forEach.call(now,function(e,i){ if(old[i]===to[i]) return; e.style.transition='none'; e.style[prop]=old[i]!=null&&old[i]!==''?old[i]:'0'; });
    void host.offsetWidth;
    Array.prototype.forEach.call(now,function(e,i){ e.style.transition=''; e.style[prop]=to[i]; });
  }

  function bump(el){
    el=q(el); if(!el || still()) return;
    el.animate([{scale:1},{scale:1.08},{scale:1}],{duration:320,easing:SPRING});
  }

  /* <details> sections open and close by height instead of snapping.
     The toggle still happens for real, so anything listening for it works. */
  document.addEventListener('click',function(e){
    var sm=e.target.closest && e.target.closest('summary'); if(!sm || e.defaultPrevented) return;
    var d=sm.parentElement; if(!d || d.tagName!=='DETAILS' || d.hasAttribute('data-sx-still') || still()) return;
    e.preventDefault();
    if(d._sx){ d._sx.cancel(); d._sx=null; }
    var from=d.offsetHeight, opening=!d.open, to;
    d.style.overflow='hidden';
    if(opening){ d.open=true; to=d.offsetHeight; }
    else { d.open=false; to=d.offsetHeight; d.open=true; }
    var a=d.animate([{height:from+'px'},{height:to+'px'}],{duration:opening?320:240,easing:E});
    d._sx=a;
    a.onfinish=function(){ d._sx=null; d.style.overflow=''; if(!opening) d.open=false; };
    a.oncancel=function(){ d.style.overflow=''; };
    if(opening){ Array.prototype.forEach.call(d.children,function(c){ if(c!==sm) c.animate([{opacity:0},{opacity:1}],{duration:260,delay:60,easing:E,fill:'backwards'}); }); }
  });

  window.SX={still:still, flip:flip, enter:enter, pill:pill, expand:expand, morph:morph, bump:bump};
})();
</script>

   Provo, and the letter counts builds within that day (a, b, c...). The update
   bar reads the first v:'...' in the live file, so this list must stay the
   first place that pattern appears. */
const CHANGELOG=[
  {v:'2026.10.22-d', note:'PLAY BUTTON: every Steam game now has a Play button next to its status. It opens the game through Steam on the PC you are using, so it shows up on computers only. The first time, your browser asks to open Steam; tick the box to always allow it.'},
  {v:'2026.10.22-c', note:'TRAILERS PLAY IN THE APP: tap a trailer in the Store page section and it plays right there, on phones and computers. If a trailer can\u2019t play it opens on Steam instead.'},
  {v:'2026.10.22-b', note:'STORE PAGE: every Steam game has a new Store page section with the game\u2019s description, developer and publisher, release date, genres, Steam review score, Metacritic score, current price and sale, trailers and screenshots, PC requirements, languages and its DLC. Upcoming DLC has a Track button that adds it to Releases with a countdown. Your Worker needs the updated gamelog-sync.js for this.'},
  {v:'2026.10.22-a', note:'WHAT\u2019S NEW: every Steam game has a new What\u2019s new section with its recent patch notes and announcements. If something was posted after you last played and you have not opened that section yet, the game gets a gold \u201cNew since you left\u201d tag. Opening the section clears it on all your devices. Your Worker needs the updated gamelog-sync.js for this.'},
  {v:'2026.10.21-e', note:'FULL COVER ART: covers now use the same tall shape as Steam box art, so titles at the top are no longer cut off. Your score moved to the bottom corner so it stops sitting on top of the game\u2019s logo.'},
  {v:'2026.10.21-d', note:'PLAYBACK JOINS THE SUITE: your music and TV/film log now sits in the top bar and the app grid, with its teal cassette icon. On a computer it is the last tab across the top; on a phone it is in the grid.'},
  {v:'2026.10.21-c', note:'NEW LIFT ICON: Lift\u2019s tile in the app grid is redrawn so the L reads as an L \u2014 a kettlebell sits beside it instead of a plate covering its foot. Its tab in the top bar now shows a kettlebell too.'},
  {v:'2026.10.21-b', note:'YOUR OTHER APPS: the same top bar as Kitchen, Grocery, Lift, DishLog, Protocol and The Rail. On a computer every app is a tab across the top; on a phone the grid button opens them all. Game Log is in each of their switchers too.'},
  {v:'2026.10.21-a', note:'A HOME-SCREEN ICON: a gold G with a controller, in the same family as Kitchen, Grocery, Lift, DishLog and Protocol. It shows in the browser tab, the sidebar, and when you add Game Log to your home screen. NEW VERSION PROMPT: when a newer copy is on GitHub, a bar slides down from the top \u2014 tap Reload.'}
];
const BUILD=CHANGELOG[0].v;
/* ---------- Data ---------- */
const KEY = 'gamelog_v1';
const STATUSES = ['playing','paused','backlog','done','dropped'];
const LABEL = {playing:'Playing', paused:'Paused', backlog:'Backlog', done:'Finished', dropped:'Dropped'};
const LAYERS = [
  ['story','Story','Main quest, companions and the side quests that matter.'],
  ['power','Power','Skills, gear and upgrades that make the fights better.'],
  ['checklist','Checklist','Collectibles, challenges and map icons.']
];
const SCORE_WORD = ['', 'Unplayable','Awful','Bad','Weak','Mixed','Okay','Good','Great','Amazing','Masterpiece'];
const PALETTES = [
  ['#3B2A6B','#F5B63F'],['#0F4C5C','#62D6B8'],['#5B1F3A','#F0798A'],['#243A72','#8FB8FF'],
  ['#4A3B1F','#F2D16B'],['#1F4A3A','#B8E986'],['#3A2350','#C79BFF'],['#5A2E1F','#FF9F6B'],
  ['#5E1420','#FF5A4E'],['#2E3440','#D8DEE9']
];
const paletteFor = g => PALETTES[g.tint >= 0 && g.tint < PALETTES.length ? g.tint : hash(g.title) % 8];

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const localDate = (d = new Date()) => { const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d, opts = {month:'short', day:'numeric', year:'numeric'}) => d ? new Date(d + 'T00:00').toLocaleDateString(undefined, opts) : '';

function blankGame(title){
  return {id:uid(), title, platform:'PC', status:'backlog', rating:0, hours:0, started:'', finished:'', lastPlayed:'', cover:'', hero:'', steamId:0, artTried:false, tint:-1, ach:null, newsSeen:0,
    note:{where:'', next:'', recap:''}, review:'',
    layers:{story:{inFinish:true,items:[]}, power:{inFinish:false,items:[]}, checklist:{inFinish:false,items:[]}},
    missables:[], releases:[]};
}

function normalize(g){
  const b = blankGame(g.title || 'Untitled');
  for (const k in b) if (g[k] === undefined) g[k] = b[k];
  g.note = Object.assign({where:'',next:'',recap:''}, g.note);
  LAYERS.forEach(([k]) => { g.layers[k] = g.layers[k] || {inFinish:k === 'story', items:[]}; });
  g.rating = Math.max(0, Math.min(10, Math.round(+g.rating || 0)));
  g.hours = +g.hours || 0;
  g.newsSeen = +g.newsSeen || 0;
  if (!STATUSES.includes(g.status)) g.status = 'backlog';
  return g;
}

function migrate(s){
  if (!s || !Array.isArray(s.games)) s = {version:2, games:[]};
  if ((s.version || 1) < 2) {
    s.games.forEach(g => { g.rating = Math.round((+g.rating || 0) * 2); if (g.id === 'seed-crimson-desert' && g.tint === undefined) g.tint = 8; });
    s.version = 2;
  }
  s.games.forEach(normalize);
  return s;
}

function seed(state){
  state.seeded = state.seeded || {};
  if (state.seeded.crimson) return;

  warn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
  logo:'<svg width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="4" width="15" height="20" rx="3" fill="#3B2A6B"/><rect x="3" y="4" width="3" height="20" rx="1.5" fill="#F5B63F"/><rect x="10" y="4" width="15" height="20" rx="3" fill="#F5B63F" opacity=".9"/><path d="M15 11l6 3-6 3z" fill="#161A33"/></svg>'
};

function coverHTML(g, opts = {}){
  const st = stats(g);
  const vt = opts.vt === false ? '' : `view-transition-name:cv-${g.id};`;
  const url = /^https:\/\/[^\s"'<>]+$/.test(g.cover) ? g.cover : '';
  const h = hash(g.title), [a, b] = paletteFor(g), ang = 20 + (h >> 4) % 140, x = 15 + (h >> 9) % 70;
  const bg = `background:radial-gradient(110% 70% at ${x}% 8%,${b}cc 0%,transparent 58%),repeating-linear-gradient(${ang}deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px),linear-gradient(165deg,${a} 10%,#12152B 95%);`;
  const wide = url && !/library_600x900/.test(url);
  return `<div class="cover ${url ? 'img' : ''} ${wide ? 'wide' : ''}" style="${bg}${vt}">
    <div class="spine"></div>
    ${url ? `<img class="art" src="${esc(url)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('img','wide');this.remove()">` : ''}
    <div class="ct">${esc(g.title)}</div>
    ${opts.score && g.rating ? `<div class="score" aria-label="Score ${g.rating} out of 10">${g.rating}</div>` : ''}
    ${opts.bar !== false && st.total ? `<div class="bar"><i style="width:${st.pct}%"></i></div>` : ''}
  </div>`;
}

function pips(g, cls = ''){
  return `<div class="pips ${cls}">
    <div class="pip-row" role="radiogroup" aria-label="Score out of 10">
      ${Array.from({length:10}, (_, i) => `<button class="pip ${i < g.rating ? 'on' : ''}" role="radio" aria-checked="${i + 1 === g.rating}" aria-label="${i + 1}, ${SCORE_WORD[i + 1]}" data-act="rate" data-v="${i + 1}"></button>`).join('')}
    </div>
    <div class="val">${g.rating ? `<b>${g.rating}<small>/10</small></b><span>${SCORE_WORD[g.rating]}</span>` : `<b class="dim" style="font-size:16px;font-weight:600">Not scored</b><span>Tap to score</span>`}</div>
  </div>`;
}

function ring(st, kind = 'quests'){
  const r = 24, c = 2 * Math.PI * r, off = c * (1 - st.pct / 100), col = kind === 'quests' ? '#F5B63F' : '#62D6B8';
  return `<div class="ring">
    <svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" fill="none" stroke="#2A3160" stroke-width="6"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 30 30)"/></svg>
    <div><b>${st.pct}%</b><span>${kind === 'quests' ? (st.total ? `${st.done} of ${st.total} quests to your finish line` : 'No finish line set yet') : `${st.done} of ${st.total} Steam achievements`}</span></div>
  </div>`;
}

function checklist(arr, kind, layer, placeholder){
  return `<ul class="checks">${arr.map(i => `<li class="${i.done ? 'done' : ''}">
      <input class="tick" type="checkbox" ${i.done ? 'checked' : ''} aria-label="Mark done: ${esc(i.text)}" data-act="toggle" data-kind="${kind}" data-layer="${layer || ''}" data-id="${i.id}">
      <span class="t">${esc(i.text)}</span>
      <button class="rm" aria-label="Remove ${esc(i.text)}" data-act="del" data-kind="${kind}" data-layer="${layer || ''}" data-id="${i.id}">${ICON.x}</button>
    </li>`).join('')}</ul>
    <div class="adder"><input type="text" id="add-${kind}-${layer || 'x'}" placeholder="${placeholder}" data-enter="add" data-kind="${kind}" data-layer="${layer || ''}">
    <button class="btn quiet sm" data-act="add" data-kind="${kind}" data-layer="${layer || ''}">Add</button></div>`;
}

/* ---------- Chrome ---------- */
function renderChrome(){
  const active = state.games.filter(g => g.status === 'playing' || g.status === 'paused').length;
  const navOn = t => view.tab === t && !view.gameId ? 'on' : '';
  const ups = state.games.flatMap(g => upcoming(g).map(r => ({g, r}))).sort((a,b) => a.r.date.localeCompare(b.r.date)).slice(0, 4);
  document.getElementById('rail').innerHTML = `
    <div class="navlist">
      <button class="navbtn ${navOn('continue')}" data-act="tab" data-tab="continue">${ICON.play}Continue<span class="count">${active || ''}</span></button>
      <button class="navbtn ${navOn('library')}" data-act="tab" data-tab="library">${ICON.shelf}Library<span class="count">${state.games.length}</span></button>
    </div>
    ${ups.length ? `<div><p class="rail-sub">Coming up</p><div class="rail-up">${ups.map(({g,r}) => `
      <button data-act="open" data-id="${g.id}" data-section="releases"><div class="d">${new Date(r.date + 'T00:00').getDate()}<small>${fmtDate(r.date,{month:'short'})}</small></div>
      <div class="n">${esc(r.name)}<span>${countdown(r.date)}</span></div></button>`).join('')}</div></div>` : ''}
    <div class="rail-foot">
      <button class="syncbtn ${navOn('sync')}" data-act="tab" data-tab="sync"><span class="dot" data-sync-status data-state="${syncStatus}">${syncText()}</span></button>
    </div>`;
  document.getElementById('tabbar').innerHTML = `
    <button class="${navOn('continue')}" data-act="tab" data-tab="continue">${ICON.play}Continue</button>
    <button class="${navOn('library')}" data-act="tab" data-tab="library">${ICON.shelf}Library</button>
    <button class="${navOn('sync')}" data-act="tab" data-tab="sync">${ICON.sync}Sync</button>`;
}

/* ---------- Continue ---------- */
function renderContinue(){
  const active = state.games.filter(g => g.status === 'playing' || g.status === 'paused');
  if (!active.length) return `<div class="page">
    <h1 class="h1">Continue</h1><p class="lede">Games you're playing or have paused show up here with your save point, so coming back is easy.</p>
    <div class="empty"><b>Nothing in progress</b>Open a game in your library and set it to Playing or Paused.<div class="actions" style="justify-content:center"><button class="btn" data-act="tab" data-tab="library">Go to library</button></div></div></div>`;

  // Feature: the one with the nearest release, otherwise the one untouched longest
  const ranked = [...active].sort((a, b) => {
    const ra = upcoming(a)[0], rb = upcoming(b)[0];
    if (ra && rb) return ra.date.localeCompare(rb.date);
    if (ra || rb) return ra ? -1 : 1;
    return (a.lastPlayed || '0000').localeCompare(b.lastPlayed || '0000');
  });
  const f = ranked[0], rest = ranked.slice(1), st = stats(f), rel = upcoming(f)[0], miss = openMissables(f);
  const next = LAYERS.flatMap(([k]) => f.layers[k].inFinish ? f.layers[k].items.filter(i => !i.done).map(i => ({...i, layer:k})) : []).slice(0, 3);
  const allUp = state.games.flatMap(g => upcoming(g).map(r => ({g, r}))).sort((a,b) => a.r.date.localeCompare(b.r.date));

  return `<div class="page">
    <h1 class="h1">Pick up where you left off</h1>
    <p class="lede">${rel ? `${esc(rel.name)} lands ${countdown(rel.date).toLowerCase()}. Here's where you stand in ${esc(f.title)}.` : `${esc(f.title)} has waited the longest. Here's where you stand.`}</p>

    <section class="feature" aria-label="${esc(f.title)}">
      <button class="slot" data-act="open" data-id="${f.id}" aria-label="Open ${esc(f.title)}">${coverHTML(f, {score:true})}</button>
      <div>
        <h2>${esc(f.title)}</h2>
        <div class="meta"><span>${LABEL[f.status]}</span><span>${since(f.lastPlayed)}</span><span>${st.pct}% to finish line</span>${miss ? `<span class="alert">${miss} missable${miss > 1 ? 's' : ''} open</span>` : ''}${newTag(f)}</div>
        ${f.note.where || f.note.next ? `<div class="save">
          <div><h4>Where you were</h4><p>${esc(f.note.where) || '<span class="dim">Not written yet</span>'}</p></div>
          <div class="next"><h4>Next step</h4><p>${esc(f.note.next) || '<span class="dim">Not written yet</span>'}</p></div>
        </div>` : ''}
        ${next.length ? `<div class="upnext"><h4>Next quests</h4><ul class="checks">${next.map(i => `<li>
          <input class="tick" type="checkbox" aria-label="Mark done: ${esc(i.text)}" data-act="toggle" data-kind="item" data-layer="${i.layer}" data-id="${i.id}" data-game="${f.id}">
          <span class="t">${esc(i.text)}</span><span></span></li>`).join('')}</ul></div>` : ''}
        <div class="actions">
          <button class="btn" data-act="open" data-id="${f.id}">Open game</button>
          <button class="btn quiet" data-act="played" data-game="${f.id}">I played today</button>
          ${/^https?:\/\//.test(f.note.recap) ? `<a class="btn quiet" href="${esc(f.note.recap)}" target="_blank" rel="noopener">Watch recap</a>` : ''}
        </div>
      </div>
    </section>

    ${rest.length ? `<h2 class="h2">Also in progress</h2><div class="shelf" style="margin-bottom:44px">${rest.map(slot).join('')}</div>` : ''}

    ${allUp.length ? `<h2 class="h2">Coming up</h2><div class="timeline">${allUp.map(({g, r}) => `
      <button class="tl" data-act="open" data-id="${g.id}" data-section="releases">
        <div class="day">${new Date(r.date + 'T00:00').getDate()}<small>${fmtDate(r.date, {month:'short', year:'numeric'})}</small></div>
        <div class="what"><b>${esc(r.name)}</b><span>${esc(g.title)}</span></div>
        <div class="cd">${countdown(r.date)}</div>
      </button>`).join('')}</div>` : ''}
  </div>`;
}

function slot(g){
  const st = stats(g);
  return `<button class="slot" data-act="open" data-id="${g.id}">
    ${coverHTML(g, {score:true})}
    <div><div class="lbl">${esc(g.title)}</div>
    <div class="sub"><span>${LABEL[g.status]}</span>${st.total ? `<span>${st.pct}%</span>` : ''}${achPct(g) !== null ? `<span class="achchip" title="${g.ach.done} of ${g.ach.total} achievements">${ICON.trophy}${achPct(g)}%</span>` : ''}${newTag(g)}</div></div>
  </button>`;
}

/* ---------- Library ---------- */
function renderLibrary(){
  const q = view.q.toLowerCase();
  const sorters = {
    title:(a,b) => a.title.localeCompare(b.title),
    score:(a,b) => b.rating - a.rating || a.title.localeCompare(b.title),
    recent:(a,b) => (b.lastPlayed || '').localeCompare(a.lastPlayed || ''),
    progress:(a,b) => stats(b).pct - stats(a).pct
  };
  const list = state.games.filter(g => (view.filter === 'all' || g.status === view.filter) && g.title.toLowerCase().includes(q)).sort(sorters[view.sort]);
  const count = s => s === 'all' ? state.games.length : state.games.filter(g => g.status === s).length;
  return `<div class="page">
    <div class="libhead">
      <div><h1 class="h1">Library</h1><p class="lede" style="margin:0">${state.games.length} game${state.games.length === 1 ? '' : 's'}, scored out of 10.</p></div>
      <div class="addgame"><input type="text" id="newTitle" placeholder="Add a game by title" aria-label="Game title"><button class="btn" data-act="add-game">Add game</button><button class="btn quiet" data-act="steam-import" ${importing ? 'disabled' : ''}>${importing ? 'Importing…' : 'Import from Steam'}</button></div>
    </div>
    <div class="libtools">
      <div class="seg" role="tablist" aria-label="Filter by status">${['all', ...STATUSES].map(s => `<button class="${view.filter === s ? 'on' : ''}" data-act="filter" data-f="${s}">${s === 'all' ? 'All' : LABEL[s]}<span class="n">${count(s)}</span></button>`).join('')}</div>
      <input type="search" class="search" id="search" placeholder="Search titles" value="${esc(view.q)}" aria-label="Search titles">
      <select id="sort" aria-label="Sort">${[['title','Title A–Z'],['score','Highest score'],['recent','Recently played'],['progress','Most progress']].map(([v,l]) => `<option value="${v}" ${view.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="shelf">${list.map(slot).join('')}</div>`
      : `<div class="empty"><b>${state.games.length ? 'No matches' : 'Your shelf is empty'}</b>${state.games.length ? 'Try another filter or search.' : 'Add your first game with the field above.'}</div>`}
  </div>`;
}

    <h1 class="h1">Sync</h1>
    <p class="lede">Keep your PC and phone on the same library. Changes upload a moment after you make them, and the app checks for newer data whenever you come back to it.</p>

        <div class="actions" style="margin-top:0">

          <button class="btn quiet" data-act="steam-import" ${importing || !syncOn() ? 'disabled' : ''}>${importing === 'recent' ? 'Importing…' : 'Import 10 recent games'}</button>
        </div>
        ${steamStatusHtml()}
      </section>
      <section class="panel">

          <button class="btn quiet" data-act="import">Restore from file</button>
        </div>
      </section>
      <section class="panel">
        <h2 class="h2" style="margin:0">This version</h2>
        <p class="buildid">Build ${esc(BUILD)}</p>
        <p><b>New:</b> ${esc(CHANGELOG[0].note)}</p>
        ${CHANGELOG.length > 1 ? `<ul class="hist">${CHANGELOG.slice(1).map(c => `<li><code>${esc(c.v)}</code>${esc(c.note)}</li>`).join('')}</ul>` : ''}
      </section>
    </div>
  </div>`;
}

/* ---------- Game ---------- */
/* Steam launch: steam://run/<appid> hands off to the Steam client on this PC.
   Only offered on computers; a phone or tablet has no Steam client to open. */
const CAN_LAUNCH = !/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
function playBtn(g){
  const id = Math.floor(Number(g.steamId));
  if (!CAN_LAUNCH || !(id > 0)) return '';
  return `<a class="btn play" href="steam://run/${id}" data-act="launch" aria-label="Play ${esc(g.title)} in Steam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Play</a>`;
}
const SECTIONS = [['save','Save point'],['quests','Quests'],['achievements','Achievements'],['news','What\u2019s new'],['store','Store page'],['missables','Missables'],['releases','Releases'],['review','Review & details']];

function renderGame(g){
  const st = stats(g), miss = openMissables(g), ups = upcoming(g).length;
  const badge = {quests: st.total - st.done, missables: miss, releases: ups, achievements: g.ach && g.ach.total ? g.ach.total - g.ach.done : 0, news: newCount(g)};
  const tint = paletteFor(g);
  return `
  <header class="hero">
    ${/^https:\/\//.test(g.hero) ? `<div class="hero-img" style="background-image:url('${esc(g.hero)}')"></div>` : `<div class="hero-bg" style="background:radial-gradient(60% 80% at 20% 30%,${tint[1]}66,transparent 70%),radial-gradient(50% 70% at 70% 20%,${tint[0]},transparent 70%)"></div>`}
    <div class="hero-in">
      ${coverHTML(g, {bar:false})}
      <div>
        <button class="back" data-act="back">${ICON.back}${view.tab === 'library' ? 'Library' : 'Continue'}</button>
        <h1>${esc(g.title)}</h1>
        <div class="hero-row">
          ${playBtn(g)}
          <select class="status-pick" data-f="status" data-rerender="1" aria-label="Status">${STATUSES.map(s => `<option value="${s}" ${g.status === s ? 'selected' : ''}>${LABEL[s]}</option>`).join('')}</select>
          ${ring(st)}
          ${achPct(g) !== null ? `<button data-act="section" data-s="achievements" aria-label="Open achievements" style="border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer">${ring({total:g.ach.total, done:g.ach.done, pct:achPct(g)}, 'achievements')}</button>` : ''}
          ${pips(g)}
          ${newTag(g, 'button')}
        </div>
      </div>
    </div>
  </header>
  <nav class="sections" aria-label="Game sections"><div class="sections-in">
    ${SECTIONS.filter(([k]) => !['achievements','news','store'].includes(k) || g.steamId).map(([k, l]) => `<button class="sec ${view.section === k ? 'on' : ''}" data-act="section" data-s="${k}" aria-current="${view.section === k}">${l}${badge[k] ? `<span class="n ${k === 'missables' ? 'warn' : k === 'news' ? 'new' : ''}">${badge[k]}</span>` : ''}</button>`).join('')}
  </div></nav>
  <div class="page">${({save:secSave, quests:secQuests, achievements:secAch, news:secNews, store:secStore, missables:secMissables, releases:secReleases, review:secReview})[view.section](g)}</div>`;
}

function secSave(g){
  return `
    <div class="played">
      <p><b>${since(g.lastPlayed)}</b>${g.lastPlayed ? ` <span class="dim">(${fmtDate(g.lastPlayed)})</span>` : ''}</p>
      <button class="btn quiet sm" data-act="played">I played today</button>
    </div>
    ${g.ach && g.ach.last ? `<p class="achlast">Last achievement: <b>${esc(g.ach.last.name)}</b> <span class="dim">· ${fmtDate(localDate(new Date(g.ach.last.time * 1000)))}</span></p>` : ''}
    <div class="journal">
      <div class="panel">
        <h3>Where I was</h3><p class="hint">Chapter, area, what you were in the middle of.</p>
        <textarea data-f="note.where" aria-label="Where I was" placeholder="Write it before you put the game down.">${esc(g.note.where)}</textarea>
      </div>
      <div class="panel next">
        <h3>Next step when I'm back</h3><p class="hint">The first thing to do so you don't stall out.</p>
        <textarea data-f="note.next" aria-label="Next step" placeholder="One clear thing to start with.">${esc(g.note.next)}</textarea>
      </div>
    </div>
    <div class="panel">
      <div class="stats">
        <div class="field"><label for="f-recap">Story recap link</label><input type="url" id="f-recap" data-f="note.recap" value="${esc(g.note.recap)}" placeholder="https://youtube.com/…"></div>
        <div class="field"><label for="f-hours">Hours played</label><input type="number" id="f-hours" min="0" step="0.5" data-f="hours" data-num="1" value="${g.hours || ''}"></div>
        <div class="field"><label for="f-last">Last played</label><input type="date" id="f-last" data-f="lastPlayed" value="${g.lastPlayed}"></div>
      </div>
    </div>`;
}

function secAch(g){
  const c = achCache[g.steamId], loading = achLoading.has(g.id);
  if (!syncOn()) return `<div class="empty"><b>Connect sync to load achievements</b>Achievements come from Steam through your Worker.<div class="actions" style="justify-content:center"><button class="btn" data-act="tab" data-tab="sync">Go to Sync</button></div></div>`;
  if (!c || !c.items) return c && c.err && !loading
    ? `<div class="empty"><b>Couldn't load achievements</b>${esc(c.err)}<div class="actions" style="justify-content:center"><button class="btn" data-act="ach-refresh">Try again</button></div></div>`
    : `<div class="empty"><b>Loading achievements</b>Asking Steam for ${esc(g.title)}.</div>`;
  if (!c.items.length) return `<div class="empty"><b>No Steam achievements</b>${esc(g.title)} doesn't have achievements on Steam. Use Quests to track your own finish line.</div>`;

  const items = c.items, done = items.filter(i => i.done).length, pct = Math.floor(done / items.length * 100);
  const f = view.achFilter || 'locked', sort = view.achSort || 'common';
  const rarestDone = items.filter(i => i.done && i.pct !== null).sort((a, b) => a.pct - b.pct)[0];
  let list = items.filter(i => f === 'all' || (f === 'locked' ? !i.done : i.done));
  const sorters = {
    common:(a, b) => (b.pct ?? -1) - (a.pct ?? -1),
    rare:(a, b) => (a.pct ?? 101) - (b.pct ?? 101),
    recent:(a, b) => b.time - a.time,
    name:(a, b) => a.name.localeCompare(b.name)
  };
  list = [...list].sort(sorters[sort]);
  const hiddenLeft = items.filter(i => i.hidden && !i.done).length;
  const mins = Math.round((Date.now() - c.fetched) / 60000);
  const ago = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins / 60)} h ago` : fmtDate(localDate(new Date(c.fetched)));
  return `
    <div class="achsum">
      <div class="big">${done}<small> / ${items.length}</small></div>
      <div>
        <div class="meter" role="img" aria-label="${pct}% of achievements unlocked"><i style="width:${pct}%"></i></div>
        <p>${pct}% unlocked${rarestDone ? ` · Rarest: <b style="color:var(--paper)">${esc(rarestDone.name)}</b> (${rarestDone.pct}% of players)` : ''}${hiddenLeft ? ` · ${hiddenLeft} hidden still locked` : ''}</p>
      </div>
    </div>
    <div class="achtools">
      <div class="seg" role="tablist" aria-label="Filter achievements">${[['locked','Locked'],['done','Unlocked'],['all','All']].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="ach-filter" data-v="${k}">${l}<span class="n">${k === 'all' ? items.length : k === 'done' ? done : items.length - done}</span></button>`).join('')}</div>
      <select id="achSort" aria-label="Sort achievements">${[['common','Most common first'],['rare','Rarest first'],['recent','Recently unlocked'],['name','Name A–Z']].map(([v, l]) => `<option value="${v}" ${sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="grow"></span>
      <span class="dim" style="font-size:13px">${loading ? 'Refreshing…' : c.err ? `<span class="err">Last refresh failed: ${esc(c.err)}</span>` : `Updated ${ago}`}</span>
      <button class="btn quiet sm" data-act="ach-refresh" ${loading ? 'disabled' : ''}>Refresh</button>
    </div>
    ${list.length ? `<ul class="achlist">${list.map(i => {
      const masked = i.hidden && !i.done && !(view.reveal && view.reveal.has(i.id));
      return `<li class="${i.done ? '' : 'locked'}">
        <img src="${/^https:\/\//.test(i.icon) ? esc(i.icon) : ''}" alt="" loading="lazy">
        <div>${masked ? `<b>Hidden achievement</b><span class="d">Might spoil the story. <button class="reveal" data-act="ach-reveal" data-id="${esc(i.id)}">Reveal</button></span>`
          : `<b>${esc(i.name)}</b><span class="d">${esc(i.desc) || (i.hidden ? '<span class="dim">No description (hidden)</span>' : '')}</span>`}</div>
        <div class="r">${i.pct !== null ? `<b class="${i.pct < 10 ? 'rare' : ''}">${i.pct}%</b><br>of players` : ''}${i.done && i.time ? `<br>${fmtDate(localDate(new Date(i.time * 1000)))}` : ''}</div>
      </li>`; }).join('')}</ul>`
      : `<div class="empty"><b>${f === 'locked' ? 'All achievements unlocked' : 'Nothing unlocked yet'}</b>${f === 'locked' ? '100% on Steam. Nice.' : 'Your first one will show up here.'}</div>`}`;
}

function secQuests(g){
  return `
    <p class="quest-note">Decide what "done" means before you start. Layers marked <b>Counts</b> make up your finish line; the rest are optional and never hold your progress back.</p>
    <div class="layers">
      ${LAYERS.map(([k, name, desc]) => {
        const L = g.layers[k], d = L.items.filter(i => i.done).length, pct = L.items.length ? d / L.items.length * 100 : 0;
        return `<section class="panel layer ${L.inFinish ? '' : 'opt'}">
          <div class="layer-top"><h3>${name}</h3>
            <button class="counts ${L.inFinish ? 'on' : ''}" data-act="layer" data-layer="${k}" aria-pressed="${L.inFinish}">${L.inFinish ? 'Counts' : 'Optional'}</button></div>
          <p class="desc">${desc}</p>
          <div class="lbar"><i style="width:${pct}%"></i></div>
          <div class="dim" style="font-size:13px;margin-bottom:4px">${d} of ${L.items.length} done</div>
          ${checklist(L.items, 'item', k, `Add a ${name.toLowerCase()} quest`)}
        </section>`; }).join('')}
    </div>`;

function secMissables(g){
  return `<section class="panel warnpanel">
    <div class="warnhead">${ICON.warn}<div><h3>Clear these before you move the story forward</h3>
    <p>Things you can lose, or lose track of, by progressing too far. Check them off as you handle them.</p></div></div>

function secNews(g){
  if (!syncOn()) return `<div class="empty"><b>Connect sync to load What\u2019s new</b>Patch notes and announcements come from Steam through your Worker.<div class="actions" style="justify-content:center"><button class="btn" data-act="tab" data-tab="sync">Go to Sync</button></div></div>`;
  const c = newsCache[g.steamId];
  if (!c) return `<div class="empty"><b>Loading What\u2019s new</b>Asking Steam for ${esc(g.title)}.</div>`;
  const all = c.items || [];
  if (c.err && !all.length) return `<div class="empty"><b>Couldn\u2019t load What\u2019s new</b>${esc(c.err)}<div class="actions" style="justify-content:center"><button class="btn" data-act="news-refresh">Try again</button></div></div>`;
  const base = view.newsBase && view.newsBase.id === g.id ? view.newsBase.t : newsSince(g);
  const f = view.newsFilter || 'all';
  const list = all.filter(i => f === 'all' || i.kind === 'patch');
  const fresh = base ? all.filter(i => i.date > base).length : 0;
  const day = t => fmtDate(localDate(new Date(t * 1000)));
  const safe = u => /^https?:\/\//.test(u) ? u : '';
  return `<section class="panel newspanel">
    <div class="newshead">
      <div><h2 class="h2" style="margin:0">What\u2019s new</h2>
        <p class="newsnote">${fresh ? `<b>${fresh} new</b> since ${day(base)}.` : all.length ? 'Nothing new since you last played or checked.' : ''}${c.err ? ` <span class="warnt">Couldn\u2019t refresh: ${esc(c.err)}</span>` : ''}</p></div>
      <div class="newsctl">
        <div class="seg" role="tablist" aria-label="Filter posts">${[['all','All'],['patch','Patch notes']].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="news-filter" data-v="${k}">${l}<span class="n">${k === 'all' ? all.length : all.filter(i => i.kind === 'patch').length}</span></button>`).join('')}</div>
        <button class="btn quiet" data-act="news-refresh">Refresh</button>
      </div>
    </div>
    ${list.length ? `<div class="posts">${list.map(i => {
      const isNew = base && i.date > base;
      return `<article class="post ${isNew ? 'fresh' : ''}">
        <div class="ph"><span class="kind ${i.kind}">${i.kind === 'patch' ? 'Patch notes' : 'News'}</span>${isNew ? '<span class="newtag">New</span>' : ''}<span class="when">${day(i.date)}${i.label ? ' \u00b7 ' + esc(i.label) : ''}</span></div>
        <h3>${safe(i.url) ? `<a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>` : esc(i.title)}</h3>
        ${i.excerpt ? `<p class="ex">${esc(i.excerpt)}</p>` : ''}
        ${i.more && safe(i.url) ? `<a class="more" href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">Read the full post on Steam</a>` : ''}
      </article>`;
    }).join('')}</div>`
    : `<div class="empty"><b>${all.length ? 'No patch notes found' : 'Nothing posted yet'}</b>${all.length ? 'Switch to All to see announcements.' : `Steam has no news for ${esc(g.title)}.`}</div>`}
  </section>`;
}

function secStore(g){

    d.metacritic ? `<${safe(d.metacritic.url) ? `a href="${esc(safe(d.metacritic.url))}" target="_blank" rel="noopener noreferrer"` : 'div'} class="scorecard">
      <div class="v ${tone(d.metacritic.score)}">${d.metacritic.score}</div>
      <div class="l"><b>Metacritic</b><span>Critic score</span></div></${safe(d.metacritic.url) ? 'a' : 'div'}>` : '',
    price ? `<div class="scorecard"><div class="v" style="font-size:18px;color:var(--paper)">$</div><div class="l"><b>${price}</b><span>Steam price (US)</span></div></div>` : ''
  ].filter(Boolean).join('');

  const vids = d.trailers.filter(t => safe(t.hls) || safe(t.mp4) || safe(t.webm));
  const media = [
    ...vids.slice(0, 2).map((t, i) => `<button class="vid" data-act="store-play" data-i="${i}" aria-label="Play ${esc(t.name)}">${safe(t.thumb) ? `<img src="${esc(t.thumb)}" alt="">` : ''}<span class="play">\u25B6 ${esc(t.name)}</span></button>`),
    ...(!vids.length ? d.trailers.slice(0, 1).filter(t => safe(t.thumb)).map(t => `<a href="${storeUrl}" target="_blank" rel="noopener noreferrer" aria-label="Watch ${esc(t.name)} on Steam"><img src="${esc(t.thumb)}" alt="" loading="lazy"><span class="play">\u25B6 Watch on Steam</span></a>`) : []),
    ...d.shots.filter(s => safe(s.thumb)).map((s, i) => `<a href="${esc(safe(s.full) || s.thumb)}" target="_blank" rel="noopener noreferrer" aria-label="Screenshot ${i + 1}"><img src="${esc(s.thumb)}" alt="" loading="lazy"></a>`)
  ];

  const long = d.about.length > 700;
  const reqBlock = (title, rows) => rows.length ? `<div><h3>${title}</h3><dl>${rows.map(r => r.k ? `<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>` : `<dd style="grid-column:1/-1">${esc(r.v)}</dd>`).join('')}</dl></div>` : '';

  return `<div class="store">
    <section class="panel">
      <div class="store-top">
        <div>
          ${d.short ? `<p class="store-lead">${esc(d.short)}</p>` : ''}

            ${fact('Developer', esc(d.developers.join(', ')))}
            ${fact('Publisher', esc(d.publishers.join(', ')))}
            ${fact('Release date', d.release ? esc(d.release.date || (d.release.soon ? 'Coming soon' : '')) : '')}
            ${fact('Steam achievements', d.achievements ? String(d.achievements) : '')}
            ${fact('Controller', d.controller === 'full' ? 'Full support' : d.controller === 'partial' ? 'Partial support' : '')}
            ${fact('Platforms', esc(d.platforms.map(p => ({windows:'Windows', mac:'macOS', linux:'Linux / SteamOS'})[p] || p).join(', ')))}
          </dl>
          ${d.genres.length ? `<div class="chips genre" style="margin-top:18px">${d.genres.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="scores">
          ${scores}
          <div class="store-links">
            <a class="btn" href="${storeUrl}" target="_blank" rel="noopener noreferrer">Open on Steam</a>
            ${safe(d.website) ? `<a class="btn quiet" href="${esc(safe(d.website))}" target="_blank" rel="noopener noreferrer">Official site</a>` : ''}
          </div>
          <span class="dim" style="font-size:13px">${loading ? 'Refreshing…' : c.err ? `<span class="err">Last refresh failed: ${esc(c.err)}</span>` : `Updated ${ago}`} · <button class="reveal" style="border:0;background:none;color:var(--gold);padding:0;font-size:13px;cursor:pointer" data-act="store-refresh" ${loading ? 'disabled' : ''}>Refresh</button></span>
        </div>
      </div>
    </section>

    ${media.length ? `<section class="panel"><h2 class="h2">Trailers & screenshots</h2><div class="media">${media.join('')}</div></section>` : ''}

      <div class="about-wrap ${long && !view.storeMore ? '' : 'open'}"><p class="about">${esc(d.about)}</p></div>

      <ul class="dlc">${d.dlc.map(x => {
        const day = x.date ? unixDay(x.date) : '';
        const upcomingDlc = x.soon || (day && day >= today);
        return `<li>
          <div class="nm"><a href="https://store.steampowered.com/app/${x.id}/" target="_blank" rel="noopener noreferrer" style="color:var(--paper);text-decoration:none">${esc(x.name)}</a>
            <small class="${upcomingDlc ? 'soon' : ''}">${upcomingDlc ? (day ? `Out ${fmtDate(day)}` : esc(x.soonText || 'Coming soon')) : day ? `Released ${fmtDate(day)}` : ''}</small></div>
          <span class="pr">${esc(x.price)}</span>
          <span class="trkcell">${upcomingDlc && day ? (tracked(x.name) ? '<span class="trk">✓ In Releases</span>' : `<button class="btn quiet sm" data-act="store-track" data-name="${esc(x.name)}" data-date="${day}">Track</button>`) : ''}</span>
        </li>`; }).join('')}</ul>
    </section>` : ''}

    ${d.features.length || d.languages ? `<section class="panel">
      ${d.features.length ? `<h2 class="h2">Features</h2><div class="chips">${d.features.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      ${d.languages ? `<h2 class="h2" style="margin-top:${d.features.length ? 24 : 0}px">Languages</h2><p class="muted" style="margin:0;font-size:14.5px">${esc(d.languages)}</p>
        ${d.audioLangs.length ? `<p class="dim" style="margin:6px 0 0;font-size:13px">Full audio: ${esc(d.audioLangs.join(', '))}</p>` : ''}` : ''}
    </section>` : ''}

    ${d.reqMin.length || d.reqRec.length ? `<section class="panel"><h2 class="h2">PC requirements</h2>
      <div class="reqs">${reqBlock('Minimum', d.reqMin)}${reqBlock('Recommended', d.reqRec)}</div>
    </section>` : ''}

    ${d.ageNote ? `<section class="panel"><h2 class="h2">Content notes</h2><p class="muted" style="margin:0;font-size:14.5px;white-space:pre-line">${esc(d.ageNote)}</p></section>` : ''}
  </div>`;
}

        ${view.art ? `<div class="artpick">

/* ---------- Render + navigation ---------- */
function render(){
  renderChrome();
  const g = view.gameId && game(view.gameId);
  if (view.gameId && !g) view.gameId = null;
  document.getElementById('app').innerHTML = g ? renderGame(g) : view.tab === 'continue' ? renderContinue() : view.tab === 'sync' ? renderSync() : renderLibrary();
  document.title = g ? `${g.title} · Game Log` : 'Game Log';
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
function go(fn){
  if (document.startViewTransition && !reduced.matches) document.startViewTransition(() => { fn(); render(); });
  else { fn(); render(); }
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

async function doArtSearch(){
  const a = view.art; if (!a || !a.q) return;
  a.loading = true; a.err = ''; render();
  try { a.results = await steamSearch(a.q); } catch(e) { a.err = `Search failed: ${e.message === 'Failed to fetch' ? 'couldn\'t reach the Worker' : e.message}`; }
  a.loading = false; if (view.art === a) render();
}
function setPath(obj, path, val){ const k = path.split('.'); let o = obj; while (k.length > 1) o = o[k.shift()]; o[k[0]] = val; }
function listFor(g, kind, layer){ return kind === 'miss' ? g.missables : g.layers[layer].items; }
function current(el){ return game((el && el.dataset.game) || view.gameId); }

function addItem(kind, layer){
  const g = current(); const id = `add-${kind}-${layer || 'x'}`, inp = document.getElementById(id);
  const text = inp.value.trim(); if (!text) return;
  listFor(g, kind, layer).push({id:uid(), text, done:false}); save(); render();
  const again = document.getElementById(id); if (again) again.focus();
}
function addGame(){
  const inp = document.getElementById('newTitle'); const t = inp.value.trim(); if (!t) { inp.focus(); return; }
  const g = blankGame(t); state.games.push(g); save();
  go(() => { view.gameId = g.id; view.section = 'quests'; }); window.scrollTo(0,0); toast(`Added ${t}`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'toggle') return; // checkbox: handled on change
  const g = current(el);
  switch (a) {
    case 'tab': go(() => { view.tab = el.dataset.tab; view.gameId = null; }); window.scrollTo(0,0);
      if (el.dataset.tab === 'sync' && Date.now() - (steamSum.fetched || 0) > 5 * 60000) fetchSummary();
      break;
    case 'open': view.art = null; go(() => { view.gameId = el.dataset.id; view.section = el.dataset.section || 'save'; }); window.scrollTo(0,0); { const og = game(el.dataset.id); if (og) fetchAch(og); } break;
    case 'back': go(() => { view.gameId = null; }); window.scrollTo(0,0); break;
    case 'section': view.section = el.dataset.s; view.art = null; render(); if (el.dataset.s === 'achievements' && g) fetchAch(g); if (el.dataset.s === 'news' && g) enterNews(g); if (el.dataset.s === 'store' && g) { view.storeMore = false; fetchStore(g); } break;
    case 'filter': view.filter = el.dataset.f; render(); break;
    case 'add-game': addGame(); break;
    case 'launch': toast('Opening in Steam\u2026'); break; // the link itself does the launch
    case 'steam-import': importSteam(); break;
    case 'steam-import-all': importSteam(true); break;
    case 'ach-filter': view.achFilter = el.dataset.v; render(); break;
    case 'ach-refresh': fetchAch(g, {force:true}); break;
    case 'news-filter': view.newsFilter = el.dataset.v; render(); break;
    case 'news-refresh': fetchNews(g, {force:true}); break;
    case 'store-refresh': fetchStore(g, {force:true}); break;
    case 'store-play': playTrailer(el, g); break;
    case 'store-more': view.storeMore = !view.storeMore; render(); break;
    case 'store-track': {
      const n = el.dataset.name, d = el.dataset.date;
      if (!g.releases.some(r => sameRelease(r.name, n))) { g.releases.push({id:uid(), name:n, date:d}); save(); }
      render(); toast(`Tracking ${n}. It shows on your Continue screen`); break; }
    case 'ach-reveal': (view.reveal = view.reveal || new Set()).add(el.dataset.id); render(); break;
    case 'sync-save': {
      const u = document.getElementById('s-url').value.trim(), k = document.getElementById('s-key').value.trim();
      if (!/^https:\/\//.test(u) || !k) { setStatus(syncStatus, 'enter the Worker URL (starting with https://) and the sync key'); return; }
      sync.url = u; sync.key = k; saveSyncCfg(); syncStatus = 'idle'; render(); pull(); break; }
    case 'sync-now': pull(); break;
    case 'sync-off': sync = {}; saveSyncCfg(); syncStatus = 'off'; render(); toast('Sync turned off on this device'); break;
    case 'art-open':
      if (!syncOn()) { toast('Connect sync first. Cover search runs through your Worker'); return; }
      view.art = {q:g.title, results:null}; render(); doArtSearch(); break;
    case 'art-search': view.art.q = document.getElementById('artQ').value.trim(); doArtSearch(); break;
    case 'art-pick': applyArt(g, view.art.results[+el.dataset.i]); view.art = null; save(); render(); toast('Cover updated'); break;
    case 'art-clear': g.cover = ''; g.hero = ''; g.artTried = true; save(); render(); break;
    case 'tint': g.tint = +el.dataset.v; save(); render(); break;
    case 'rate': { const v = +el.dataset.v; g.rating = g.rating === v ? 0 : v; save(); render(); break; }
    case 'del': { const L = listFor(g, el.dataset.kind, el.dataset.layer); L.splice(L.findIndex(i => i.id === el.dataset.id), 1); save(); render(); break; }
    case 'add': addItem(el.dataset.kind, el.dataset.layer); break;
    case 'layer': g.layers[el.dataset.layer].inFinish = !g.layers[el.dataset.layer].inFinish; save(); render(); break;
    case 'played': g.lastPlayed = localDate(); if (g.status === 'paused' || g.status === 'backlog') g.status = 'playing'; save(); render(); toast(`Logged a session of ${g.title}`); break;
    case 'add-rel': { const n = document.getElementById('relName').value.trim(), d = document.getElementById('relDate').value;
      if (!n || !d) { toast('Add a name and a date'); return; } g.releases.push({id:uid(), name:n, date:d}); save(); render(); break; }
    case 'del-rel': g.releases = g.releases.filter(r => r.id !== el.dataset.id); save(); render(); break;
    case 'delete-game': if (confirm(`Delete ${g.title}? This removes its quests, notes and score.`)) { state.games = state.games.filter(x => x.id !== g.id); save(); go(() => { view.gameId = null; }); toast(`Deleted ${g.title}`); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = `gamelog-backup-${localDate()}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('Backup downloaded'); break; }
    case 'import': document.getElementById('importFile').click(); break;
  }
});

// Hover preview for score pips
document.addEventListener('pointerover', e => {
  const p = e.target.closest('.pip'); if (!p) return;
  const row = p.parentElement, v = +p.dataset.v;
  row.querySelectorAll('.pip').forEach((x, i) => x.classList.toggle('hov', i < v));
});
document.addEventListener('pointerout', e => {
  const row = e.target.closest('.pip-row'); if (row && !row.contains(e.relatedTarget)) row.querySelectorAll('.pip').forEach(x => x.classList.remove('hov'));
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'sort') { view.sort = el.value; render(); return; }
  if (el.id === 'achSort') { view.achSort = el.value; render(); return; }
  const g = current(el); if (!g) return;
  if (el.dataset.act === 'toggle') {
    const it = listFor(g, el.dataset.kind, el.dataset.layer).find(i => i.id === el.dataset.id); it.done = el.checked; save();
    if (el.checked && stats(g).total && stats(g).pct === 100 && el.dataset.kind === 'item') toast(`Finish line reached in ${g.title}`);
    render(); return;
  }
  if (el.dataset.f && (el.dataset.rerender || el.dataset.rerenderBlur || el.type === 'date')) { setPath(g, el.dataset.f, el.value.trim ? el.value.trim() : el.value); save(); render(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { view.q = el.value; const pos = el.selectionStart; render(); const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos); return; }
  const g = current(el);
  if (!g || !el.dataset.f || el.dataset.rerender || el.type === 'date') return;
  const val = el.dataset.num ? (parseFloat(el.value) || 0) : el.value;
  setPath(g, el.dataset.f, val); save();
  if (el.dataset.f === 'title') { const h = document.querySelector('.hero h1'); if (h) h.textContent = val; }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.id === 'newTitle') addGame();
  else if (el.dataset.enter === 'add') addItem(el.dataset.kind, el.dataset.layer);
  else if (el.id === 'artQ') document.querySelector('[data-act="art-search"]').click();
  else if (el.id === 'relName' || el.id === 'relDate') document.querySelector('[data-act="add-rel"]').click();
});

document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.games)) throw new Error('the file has no games list');
    if (confirm(`Replace your current library with ${s.games.length} games from this backup?`)) {
      state = migrate(s); state.seeded = state.seeded || {crimson:true}; save(); view.gameId = null; render(); toast('Library restored');
    }
  } catch(err) { alert('Couldn\'t restore: ' + err.message + '. Pick a Game Log backup file.'); }
  e.target.value = '';
});

render();
pull();
setInterval(() => document.querySelectorAll('[data-sync-status]').forEach(el => el.textContent = syncText()), 30000);

/* ---------------- is there a newer copy? ---------------- */
/* 2026.10.21-a -> sortable; a two-letter suffix (after z) still sorts after one */
function buildKey(v){ const m=/^(\d{4})\.(\d\d)\.(\d\d)-([a-z]+)$/.exec(v||''); return m?m[1]+m[2]+m[3]+String(m[4].length)+m[4]:''; }
let UPD={last:0,dismissed:null,shown:null};
async function checkUpdate(force){
  if(!/^https?:$/.test(location.protocol) || !window.fetch) return;
  if(!force && Date.now()-UPD.last<5*60e3) return;
  UPD.last=Date.now();
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const html=await r.text();
    /* Compare build numbers, newer only: one update raises the bar once, even
       while GitHub's servers are still handing some requests the old copy. */
    const m=html.match(/v:'(\d{4}\.\d\d\.\d\d-[a-z]+)'/); if(!m) return;
    const live=m[1];
    if(!(buildKey(live)>buildKey(BUILD)) || live===UPD.dismissed) return;
    /* Just reloaded for this exact build and still got the old copy: GitHub
       hasn't caught up yet. Try again quietly in a minute instead of asking. */
    let tried=null; try{ tried=sessionStorage.getItem('gamelog_upd_tried'); }catch(e){}
    if(tried===live && !force){ setTimeout(()=>checkUpdate(true),60e3); return; }
    showUpdate(live);
  }catch(e){}
}
function showUpdate(ver){
  UPD.shown=ver;
  document.getElementById('updtxt').textContent='Build '+ver+' is ready';
  const b=document.getElementById('updbar'); b.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('up')));
}
document.getElementById('updgo').addEventListener('click',()=>{
  try{ sessionStorage.setItem('gamelog_upd_tried',UPD.shown||''); }catch(e){}
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  /* a query string the cache has never seen gets the live file; the next load
     cleans it off the address again */
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
});
document.getElementById('updx').addEventListener('click',()=>{
  UPD.dismissed=UPD.shown;
  const b=document.getElementById('updbar'); b.classList.remove('up'); setTimeout(()=>{ b.hidden=true; },320);
});
if(/[?&]v=\d+/.test(location.search)) try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
setTimeout(()=>checkUpdate(true),2500);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(false); });
</script>
