<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A33">
<title>Game Log</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261021a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261021a">
<link rel="manifest" href="site.webmanifest?v=20261021a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#161A33; --deep:#1F2547; --raise:#2A3160; --line:#363E70; --line-soft:#2B3260;
  --paper:#ECEEFB; --mist:#A1A8D0; --dim:#7A82B0;
  --gold:#F5B63F; --gold-ink:#2A1D05; --mint:#62D6B8; --rose:#F0798A; --sky:#8FB8FF;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --font:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --rail:248px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--night);color:var(--paper);font:400 16px/1.5 var(--font);font-variation-settings:'opsz' 16;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--gold-ink)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:28px;background:linear-gradient(180deg,#1A1F3E,var(--night))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-size:20px;font-weight:800;font-variation-settings:'wdth' 80,'opsz' 48;letter-spacing:-.01em}
.navlist{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--mist);font-weight:500;text-align:left}
.navbtn:hover{background:var(--deep);color:var(--paper)}
.navbtn.on{background:var(--deep);color:var(--paper)}
.navbtn.on svg{color:var(--gold)}
.navbtn .count{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.rail-sub{font-size:13px;color:var(--dim);padding:0 12px;margin:0 0 8px}
.rail-up{display:flex;flex-direction:column;gap:2px}
.rail-up button{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:0;background:transparent;padding:8px 12px;border-radius:var(--r-sm);text-align:left;color:var(--paper)}
.rail-up button:hover{background:var(--deep)}
.rail-up .d{font-weight:800;font-size:20px;line-height:1;font-variation-settings:'wdth' 75;color:var(--gold);text-align:center}
.rail-up .d small{display:block;font-size:11px;font-weight:500;color:var(--dim);margin-top:2px}
.rail-up .n{font-size:14px;line-height:1.3}
.rail-up .n span{display:block;color:var(--dim);font-size:12px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.rail-foot button{border:0;background:transparent;color:var(--dim);text-align:left;padding:6px 12px;border-radius:var(--r-sm);font-size:14px}
.rail-foot button:hover{color:var(--paper);background:var(--deep)}
.rail-foot .syncbtn.on{background:var(--deep);color:var(--paper)}
.dot{display:inline-flex;align-items:center;gap:8px}
.dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot[data-state=ok]::before{background:var(--mint)}
.dot[data-state=syncing]::before{background:var(--gold)}
.dot[data-state=error]::before{background:var(--rose)}
.syncpage{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
.syncpage .panel{display:flex;flex-direction:column;gap:16px}
.syncpage p{margin:0;color:var(--mist);max-width:60ch}
.err{color:var(--rose);font-size:14px;min-height:1em}
.steamstat{font-size:14px;color:var(--mist);margin:10px 0 0;line-height:1.5}
.artpick{margin-top:4px;display:flex;flex-direction:column;gap:12px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.artgrid button{border:2px solid transparent;border-radius:var(--r-sm);padding:0;background:var(--night);overflow:hidden;text-align:left;color:var(--paper)}
.artgrid button:hover{border-color:var(--gold)}
.artgrid img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--raise)}
.artgrid span{display:block;font-size:12px;line-height:1.3;padding:6px 6px 8px}
@media (max-width:760px){.syncpage{grid-template-columns:1fr}}

main{min-width:0;padding:40px clamp(18px,4vw,56px) 80px}
.page{max-width:1080px;margin:0 auto}
.tabbar{display:none}

/* Type */
.h1{font-size:clamp(30px,4vw,44px);line-height:1.05;font-weight:800;font-variation-settings:'wdth' 82,'opsz' 72;letter-spacing:-.02em;margin:0 0 6px}
.lede{color:var(--mist);margin:0 0 32px;max-width:60ch}
.h2{font-size:20px;font-weight:700;font-variation-settings:'wdth' 90,'opsz' 32;margin:0 0 14px;letter-spacing:-.005em}
.muted{color:var(--mist)} .dim{color:var(--dim)}

/* Covers */
.cover{position:relative;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;isolation:isolate;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -18px rgba(0,0,0,.6);background-color:var(--raise)}
.cover .ct{position:absolute;inset:auto 14px 16px 14px;font-weight:800;font-variation-settings:'wdth' 75,'opsz' 96;line-height:.92;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.35);z-index:2}
.cover .spine{position:absolute;top:0;bottom:0;left:0;width:6px;background:rgba(255,255,255,.18);z-index:2}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);z-index:3}
.cover .bar i{display:block;height:100%;background:var(--gold)}
.cover .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover.wide .art{object-position:center;filter:saturate(1.05)}
.cover.img .ct,.cover.img .spine{display:none}

/* Continue screen */
.feature{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:clamp(20px,3vw,40px);background:var(--deep);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,28px);margin-bottom:44px}
.feature .cover .ct{font-size:clamp(30px,3.4vw,44px)}
.feature h2{font-size:clamp(26px,3vw,36px);line-height:1.05;font-weight:800;font-variation-settings:'wdth' 82,'opsz' 72;letter-spacing:-.015em;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--mist);font-size:14px;margin-bottom:20px}
.meta .alert{color:var(--rose)}
.save{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.save div{border-left:3px solid var(--line);padding:2px 0 2px 14px}
.save div.next{border-left-color:var(--gold)}
.save h4{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--dim)}
.save p{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap}
.upnext h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--dim)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.slot{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.slot .cover{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.slot:hover .cover{transform:translateY(-4px)}
.slot .cover .ct{font-size:clamp(22px,2.3vw,28px)}
.slot .lbl{font-size:15px;font-weight:600;line-height:1.25}
.slot .sub{font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center}
.score{position:absolute;bottom:12px;right:10px;z-index:3;min-width:34px;height:34px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:rgba(22,26,51,.92);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--gold)}

.timeline{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.tl{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line-soft);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;width:100%}
.tl:hover{background:rgba(42,49,96,.35)}
.tl .day{font-weight:800;font-size:32px;line-height:.9;font-variation-settings:'wdth' 75;color:var(--paper)}
.tl .day small{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:4px}
.tl .what b{display:block;font-weight:600}
.tl .what span{color:var(--mist);font-size:14px}
.tl .cd{font-size:14px;color:var(--gold);font-weight:600;white-space:nowrap}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--gold);color:var(--gold-ink)}
.btn:hover{filter:brightness(1.06)}
.btn.quiet{background:var(--raise);color:var(--paper)}
.btn.quiet:hover{background:var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid rgba(240,121,138,.45)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.play{text-decoration:none}
.btn.play svg{width:14px;height:14px;fill:currentColor}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--dim);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],input[type=password],select,textarea{width:100%;background:var(--night);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,182,63,.18)}
textarea{resize:vertical;min-height:110px;line-height:1.55}
::placeholder{color:var(--dim)}
.seg{display:inline-flex;background:var(--deep);border:1px solid var(--line-soft);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--mist);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500}
.seg button.on{background:var(--paper);color:var(--night);font-weight:700}
.seg button .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* Checklist */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.tick{appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--line);border-radius:7px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.tick:hover{border-color:var(--mist)}
.tick:checked{background:var(--mint);border-color:var(--mint)}
.tick:checked::after{content:'';width:10px;height:6px;border-left:2.5px solid var(--night);border-bottom:2.5px solid var(--night);transform:translateY(-1px) rotate(-45deg)}
.checks li.done .t{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line)}
.checks .t{line-height:1.45}
.rm{border:0;background:transparent;color:var(--dim);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.checks li:hover .rm,.rm:focus-visible{opacity:1}
.rm:hover{color:var(--rose);background:var(--raise)}
@media (hover:none){.rm{opacity:.7}}
.adder{display:flex;gap:8px;margin-top:12px}
.adder input{flex:1}
.adder button{flex:none}

/* Library */
.libhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.libtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px}
.libtools .search{flex:1;min-width:180px;max-width:320px}
.libtools select{width:auto}
.addgame{display:flex;flex-wrap:wrap;gap:8px;min-width:min(100%,360px)}
.addgame input{flex:1 1 180px}
.btn:disabled{opacity:.55;cursor:default}
/* Achievements */
.achsum{display:grid;grid-template-columns:auto 1fr;gap:20px 32px;align-items:center;margin-bottom:24px}
.achsum .big{font-weight:800;font-size:44px;line-height:.9;font-variation-settings:'wdth' 75;font-variant-numeric:tabular-nums}
.achsum .big small{font-size:20px;color:var(--dim);font-weight:600}
.achsum .meter{height:8px;border-radius:999px;background:var(--raise);overflow:hidden;margin-bottom:10px}
.achsum .meter i{display:block;height:100%;background:var(--gold);border-radius:inherit}
.achsum p{margin:0;color:var(--mist);font-size:14px}
.achtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.achtools select{width:auto}
.achtools .grow{flex:1}
.achlist{list-style:none;margin:0;padding:0}
.achlist li{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.achlist img{width:48px;height:48px;border-radius:8px;background:var(--raise);display:block}
.achlist li.locked img{filter:grayscale(1) brightness(.6)}
.achlist b{display:block;font-weight:600}
.achlist .d{color:var(--mist);font-size:14px}
.achlist .r{text-align:right;font-size:13px;color:var(--dim);white-space:nowrap}
.achlist .r b{font-size:15px;color:var(--paper);font-variant-numeric:tabular-nums}
.achlist .r .rare{color:var(--gold)}
.achlist .reveal{border:0;background:none;color:var(--gold);padding:0;font-size:14px;cursor:pointer}
.achlast{margin:0 0 24px;color:var(--mist);font-size:14px}
.achlast b{color:var(--paper)}
.achchip{display:inline-flex;align-items:center;gap:4px}
.slot .sub{flex-wrap:wrap}
.acttag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.acttag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.acttag.active,.actc.active{color:var(--mint)} .acttag.dormant,.actc.dormant{color:var(--gold)} .acttag.lapsed,.actc.lapsed{color:var(--dim)}
.newtag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:var(--gold-ink);background:var(--gold);padding:4px 8px;border-radius:999px;border:0;white-space:nowrap}
button.newtag{cursor:pointer}
.sec .n.new{background:var(--gold);color:var(--gold-ink)}
.newshead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.newsctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.newsnote{margin:4px 0 0;font-size:14px;color:var(--mist)}
.newsnote b{color:var(--gold)} .newsnote .warnt{color:var(--rose)}
.posts{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px 18px;background:var(--night)}
.post.fresh{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.post .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-bottom:6px}
.post .kind{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--raise);color:var(--mist)}
.post .kind.patch{background:rgba(143,184,255,.16);color:var(--sky)}
.post h3{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:-.003em}
.post h3 a{color:var(--paper);text-decoration:none} .post h3 a:hover{color:var(--gold);text-decoration:underline}
.post .ex{margin:0 0 8px;color:var(--mist);font-size:14.5px;white-space:pre-line}
.post .more{font-size:14px}
/* Store page */
.store{display:flex;flex-direction:column;gap:20px}
.store-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(18px,3vw,32px)}
.store-lead{margin:0 0 18px;font-size:17px;line-height:1.55;color:var(--paper)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0}
.facts div{min-width:0} .facts dt{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
.facts dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.scores{display:flex;flex-direction:column;gap:10px}
.scorecard{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--night);color:inherit;text-decoration:none}
a.scorecard:hover{border-color:var(--line)}
.scorecard .v{font-weight:800;font-size:26px;line-height:1;font-variation-settings:'wdth' 80;text-align:center;font-variant-numeric:tabular-nums}
.scorecard .l b{display:block;font-size:15px} .scorecard .l span{font-size:13px;color:var(--dim)}
.scorecard .v.good{color:var(--mint)} .scorecard .v.mid{color:var(--gold)} .scorecard .v.bad{color:var(--rose)}
.scorecard .v s{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.store-links .btn{text-decoration:none}
.store-links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--raise);color:var(--mist)}
.chips.genre span{background:rgba(245,182,63,.14);color:var(--gold)}
.media{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -4px;padding-left:4px}
.media>*{flex:none;scroll-snap-align:start;border-radius:var(--r-sm);overflow:hidden;background:var(--night);border:1px solid var(--line-soft)}
.media video{width:min(560px,82vw);aspect-ratio:16/9;display:block;background:#000}
.media .vid{display:block;width:min(560px,82vw);aspect-ratio:16/9;position:relative;padding:0;cursor:pointer;color:inherit;font:inherit}
.media .vid img{width:100%;height:100%;object-fit:cover;display:block}
.media .vid .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 50%,rgba(0,0,0,.6));color:#fff;font-weight:700;font-size:15px;padding:0 12px;text-align:center}
.media .vid:hover .play{background:linear-gradient(transparent 30%,rgba(0,0,0,.7))}
.media a{display:block;width:min(320px,70vw);aspect-ratio:16/9;position:relative}
.media a img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.media a:hover img{transform:scale(1.03)}
.media a .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 50%,rgba(0,0,0,.55));color:#fff;font-weight:700;font-size:14px}
.about{white-space:pre-line;color:var(--mist);font-size:15px;line-height:1.6;margin:0}
.about-wrap{position:relative;max-height:230px;overflow:hidden}
.about-wrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,var(--deep))}
.about-wrap.open{max-height:none} .about-wrap.open::after{display:none}
.dlc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.dlc li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.dlc .nm{font-weight:600;min-width:0} .dlc .nm small{display:block;font-weight:400;font-size:13px;color:var(--dim)}
.dlc .nm small.soon{color:var(--gold)}
.dlc .pr{font-size:14px;color:var(--mist);white-space:nowrap;font-variant-numeric:tabular-nums}
.dlc .trk{font-size:13px;color:var(--mint);white-space:nowrap}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.reqs h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.reqs dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.reqs dt{color:var(--dim)} .reqs dd{margin:0;overflow-wrap:anywhere}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.subhead .h2{margin:0}
@media (max-width:900px){.store-top,.reqs{grid-template-columns:1fr}}

(function(){ /* suite: open/close the app grid on phones */
  var b=document.getElementById('sx-gbtn'), m=document.getElementById('sx-menu'); if(!b||!m) return;
  var t=null;
  function set(o){ b.setAttribute('aria-expanded',o?'true':'false'); clearTimeout(t); m.classList.remove('sx-out');
    if(o){ m.hidden=false; var f=m.querySelector('.sx-cell'); if(f) f.focus({preventScroll:true}); return; }
    if(m.hidden) return;
    /* let the grid shrink away instead of vanishing */
    if(window.SX && !SX.still()){ m.classList.add('sx-out'); t=setTimeout(function(){ m.hidden=true; m.classList.remove('sx-out'); },140); }
    else m.hidden=true; }
  /* a grid that is on its way out counts as closed, so tapping the button
     again mid-close reopens it rather than closing it a second time */
  function shut(){ return m.hidden || m.classList.contains('sx-out'); }
  b.addEventListener('click',function(e){ e.stopPropagation(); set(shut()); });
  m.addEventListener('click',function(e){ if(!e.target.closest('.sx-cell')||e.target.closest('[aria-current]')) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!shut()){ set(false); b.focus(); } });
  window.addEventListener('pageshow',function(){ clearTimeout(t); m.classList.remove('sx-out'); m.hidden=true; b.setAttribute('aria-expanded','false'); });
})();

  if(!bar||!btn||!pan) return;
  var APP=bar.getAttribute('data-app')||'', KEY='suite_ideas_v2_'+APP, URLKEY='suite_ideas_url', DAY=86400000,
      WORKER='https://ideas-sync.skyfro04.workers.dev', TOKEN='omakJuBdO4ZE2rXXPBuWuxRRnt920iqn', mem=[];
  var NAMES={kitchen:'Kitchen',grocery:'Grocery',lift:'Lift',dishlog:'DishLog',protocol:'Protocol',rail:'Rail',gamelog:'Game Log',playback:'Playback'};
  var LABEL=NAMES[APP]||'this app';
  var VARS=['--sx-kitchen','--sx-grocery','--sx-lift','--sx-dishlog','--sx-protocol','--sx-rail','--sx-gamelog','--sx-playback',
            '--sx-on','--sx-paper','--sx-ink','--sx-dim','--sx-line','--sx-hover'];
  var form=pan.querySelector('#sx-iform'), input=pan.querySelector('#sx-iin'), list=pan.querySelector('#sx-ilist'),

  function fit(){
    bar.classList.remove('sx-compact');
    var tabs=bar.querySelector('.sx-tabs'); if(!tabs || getComputedStyle(tabs).display==='none' || !tabs.lastElementChild) return;
    if(tabs.lastElementChild.getBoundingClientRect().right > btn.getBoundingClientRect().left - 10) bar.classList.add('sx-compact');
  }
  fit(); window.addEventListener('resize',fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ---- storage: every idea is {id,text,done,deleted,t (made),u (last changed)}. A deleted idea stays as a small marker for
     30 days so another device can't bring it back. ---- */
  function good(x){ return x && typeof x.id==='string' && typeof x.text==='string'; }
  function load(){
    var a; try{ var r=localStorage.getItem(KEY); a=r?JSON.parse(r):[]; }catch(e){ a=mem; }

    var m={}; a.concat(b).forEach(function(x){ if(!good(x)) return; var o=m[x.id]; if(!o || (x.u||0)>(o.u||0)) m[x.id]=x; });
    var cut=Date.now()-30*DAY;

  }

  /* ---- sync: saved here first, then sent in the background. Failing is fine; it tries again on the next change. ---- */

      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })

  }
  schedule(1500);
  window.addEventListener('online',function(){ schedule(300); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !pan.hidden) schedule(300); });

  /* ---- panel ---- */
  function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  var SVG_CK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var SVG_X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function render(){
    var pool=live(load()).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (b.t||0)-(a.t||0); });
    list.textContent='';
    if(!pool.length) list.appendChild(mk('li','sx-iempty','Nothing yet. Jot down anything you wish '+LABEL+' did.'));
    pool.forEach(function(x){
      var li=mk('li','sx-ii'+(x.done?' sx-done':'')); li.setAttribute('data-id',x.id);
      var ck=mk('button','sx-ick'); ck.type='button'; ck.setAttribute('role','checkbox'); ck.setAttribute('aria-checked',x.done?'true':'false');
      ck.setAttribute('aria-label',(x.done?'Mark not done: ':'Mark done: ')+x.text); ck.innerHTML=SVG_CK;
      li.appendChild(ck); li.appendChild(mk('span','sx-itx',x.text));
      var dl=mk('button','sx-idel'); dl.type='button'; dl.setAttribute('aria-label','Delete idea: '+x.text); dl.innerHTML=SVG_X;
      li.appendChild(dl); list.appendChild(li);
    });

    clrB.disabled=!pool.some(function(x){ return x.done; });
  }
  function paint(){ /* the panel lives on <body>, so hand it the bar's current colors */
    var cs=getComputedStyle(bar);
    VARS.forEach(function(v){ pan.style.setProperty(v,cs.getPropertyValue(v)); });

    if(pan.parentNode!==document.body) document.body.appendChild(pan);
    paint(); pan.hidden=false; render(); input.focus({preventScroll:true}); schedule(0);
  }

  btn.addEventListener('click',function(e){ e.stopPropagation(); set(pan.hidden); });
  pan.addEventListener('click',function(e){ if(e.target===pan) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !pan.hidden){ set(false); btn.focus(); } });
  window.addEventListener('pageshow',function(e){ if(e.persisted){ pan.hidden=true; btn.setAttribute('aria-expanded','false'); } });  /* only when the page comes back from the back/forward cache */
  window.addEventListener('storage',function(e){ if(e.key===KEY && !pan.hidden) render(); });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.replace(/\s+/g,' ').trim(); if(!v){ input.value=''; return; }
    var n=Date.now(), a=load(); a.push({id:n.toString(36)+Math.random().toString(36).slice(2,6), text:v.slice(0,280), done:0, deleted:0, t:n, u:n});
    put(a); input.value=''; render(); schedule(); input.focus({preventScroll:true});
  });
  list.addEventListener('click',function(e){
    var li=e.target.closest('.sx-ii'); if(!li) return;
    var id=li.getAttribute('data-id'), a=load(), n=Date.now();
    if(e.target.closest('.sx-ick')){ a.forEach(function(x){ if(x.id===id){ x.done=x.done?0:1; x.u=n; } }); }
    else if(e.target.closest('.sx-idel')){ a.forEach(function(x){ if(x.id===id){ x.deleted=1; x.text=''; x.u=n; } }); }
    else return;
    put(a); render(); schedule();
  });
  clrB.addEventListener('click',function(){
    var n=Date.now(), a=load(); a.forEach(function(x){ if(x.done && !x.deleted){ x.deleted=1; x.text=''; x.u=n; } });
    put(a); render(); schedule();
  });
  copyB.addEventListener('click',function(){
    var t=plain(); if(!t) return;
    function ok(){ copyB.textContent='Copied'; setTimeout(function(){ copyB.textContent='Copy list'; },1400); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(err){ copyB.textContent='Copy failed'; }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
  });
})();

<script>
/* suite motion helpers (window.SX), shared by every app. Each one is a
   no-op extra: if the browser can't animate or you've asked for reduced
   motion, the change just happens, exactly as it did before.
     SX.flip(root, sel, change)  redraw a list and let the items that stay
                                 glide to their new spots; new ones fade in
     SX.enter(root, sel, dir)    play a short staggered entrance on fresh content
     SX.pill(row, activeSel)     slide a highlight to the selected tab/chip
     SX.expand(el, open, apply)  open or close a block by its height
     SX.morph(root, sel, prop, change)  bars and meters ease to their new size
     SX.bump(el)                 a small pop for a value that just changed */
(function(){
  if(window.SX) return;
  var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  var E='cubic-bezier(.2,.8,.2,1)', SPRING='cubic-bezier(.3,1.25,.5,1)';
  function still(){ return !!(mq&&mq.matches) || typeof Element.prototype.animate!=='function'; }
  function q(x){ return typeof x==='string'?document.querySelector(x):x; }
  function keyOf(el,kf){ return kf?kf(el):(el.getAttribute('data-sx-key')||el.getAttribute('data-id')||el.getAttribute('data-k')||el.id||null); }
  function quietCss(el){ /* a redraw should not replay an entrance the item already did */
    try{ el.getAnimations({subtree:true}).forEach(function(a){ if(a.animationName) a.cancel(); }); }catch(e){} }

  function flip(root,sel,change,o){
    o=o||{}; root=q(root);
    if(!root || still()){ change(); return; }
    var before={}, vh=window.innerHeight;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || before[k]) return;
      var r=el.getBoundingClientRect(); if(!r.width && !r.height) return;
      before[k]=r;
    });
    change();
    var seen={}, n=0;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || seen[k]) return; seen[k]=1;
      var b=before[k], r=el.getBoundingClientRect();
      if(!r.width && !r.height) return;
      if(r.bottom<-40 || r.top>vh+40){ if(b) quietCss(el); return; }
      if(b){
        quietCss(el);
        var dx=b.left-r.left, dy=b.top-r.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        if(Math.abs(dy)>vh) dy=dy>0?vh*.5:-vh*.5;
        el.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:o.dur||340,easing:E});
      } else if(o.enter!==false){
        quietCss(el);
        el.animate([{opacity:0,translate:'0 6px',scale:.985},{opacity:1,translate:'0 0',scale:1}],
                   {duration:260,delay:Math.min(n++,8)*24,easing:E,fill:'backwards'});
      }
    });
  }

  function enter(root,sel,dir,o){
    o=o||{}; root=q(root); if(!root || still()) return;
    var els=sel?root.querySelectorAll(sel):root.children, vh=window.innerHeight, i=0;
    var from=dir==='left'?'-18px 0':dir==='right'?'18px 0':dir==='none'?'0 0':'0 8px';
    Array.prototype.forEach.call(els,function(el){
      if(el.classList && el.classList.contains('sx-pill')) return;
      var r=el.getBoundingClientRect(); if(r.bottom<0 || r.top>vh || !r.height) return;
      quietCss(el);
      el.animate([{opacity:0,translate:from},{opacity:1,translate:'0 0'}],
                 {duration:o.dur||300,delay:Math.min(i++,10)*(o.step==null?30:o.step),easing:E,fill:'backwards'});
    });
  }

  var rows=[];
  function pill(row,activeSel,o){
    row=q(row); if(!row) return;
    var rec=null; rows.forEach(function(x){ if(x.row===row) rec=x; });
    if(!rec){ rec={row:row, sel:activeSel, last:null, o:o||{}}; rows.push(rec); watch(rec); }
    rec.sel=activeSel||rec.sel; place(rec,true);
  }
  function place(rec,animate){
    var row=rec.row, p=row.querySelector(':scope > .sx-pill');
    if(!p){ p=document.createElement('span'); p.className='sx-pill'+(rec.o.cls?' '+rec.o.cls:''); p.setAttribute('aria-hidden','true'); row.insertBefore(p,row.firstChild); }
    if(!row.classList.contains('sx-pilled')){ row.classList.add('sx-pilled');
      if(getComputedStyle(row).position==='static') row.style.position='relative'; }
    var a=row.querySelector(rec.sel);
    if(!a || !a.offsetWidth){ p.style.opacity='0'; rec.last=null; return; }
    var now={x:a.offsetLeft, y:a.offsetTop, w:a.offsetWidth, h:a.offsetHeight}, last=rec.last;
    rec.last=now;
    p.style.opacity='1'; p.style.width=now.w+'px'; p.style.height=now.h+'px';
    p.style.transform='translate('+now.x+'px,'+now.y+'px)';
    if(animate && last && !still() && (last.x!==now.x || last.y!==now.y || last.w!==now.w)){
      p.animate([{transform:'translate('+last.x+'px,'+last.y+'px)',width:last.w+'px',height:last.h+'px'},
                 {transform:'translate('+now.x+'px,'+now.y+'px)',width:now.w+'px',height:now.h+'px'}],
                {duration:360,easing:SPRING});
    }
  }
  function watch(rec){ if(window.ResizeObserver){ new ResizeObserver(function(){ place(rec,false); }).observe(rec.row); } }
  window.addEventListener('resize',function(){ rows.forEach(function(r){ place(r,false); }); });

  function expand(el,open,apply){
    el=q(el); if(!el){ apply(open); return; }
    if(el._sx){ el._sx.cancel(); el._sx=null; }
    if(still()){ apply(open); return; }
    var cs, h, f, a;
    if(open){
      apply(true); cs=getComputedStyle(el); h=el.offsetHeight; if(!h) return;
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0},f],{duration:300,easing:E});
    } else {
      cs=getComputedStyle(el); h=el.offsetHeight; if(!h){ apply(false); return; }
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([f,{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0}],{duration:240,easing:E});
    }
    el._sx=a;
    a.onfinish=function(){ el._sx=null; el.style.overflow=''; if(!open) apply(false); };
    a.oncancel=function(){ el.style.overflow=''; };
  }

  /* redraw something whose bars or meters are set inline (width:40%), and
     let each one ease from where it was instead of snapping */
  function morph(host,sel,prop,change){
    host=q(host); if(!host){ change(); return; }
    var old=Array.prototype.map.call(host.querySelectorAll(sel),function(e){ return e.style[prop]; });
    change();
    if(still()) return;
    var now=host.querySelectorAll(sel), to=Array.prototype.map.call(now,function(e){ return e.style[prop]; });
    Array.prototype.forEach.call(now,function(e,i){ if(old[i]===to[i]) return; e.style.transition='none'; e.style[prop]=old[i]!=null&&old[i]!==''?old[i]:'0'; });
    void host.offsetWidth;
    Array.prototype.forEach.call(now,function(e,i){ e.style.transition=''; e.style[prop]=to[i]; });
  }

  function bump(el){
    el=q(el); if(!el || still()) return;
    el.animate([{scale:1},{scale:1.08},{scale:1}],{duration:320,easing:SPRING});
  }

  /* <details> sections open and close by height instead of snapping.
     The toggle still happens for real, so anything listening for it works. */
  document.addEventListener('click',function(e){
    var sm=e.target.closest && e.target.closest('summary'); if(!sm || e.defaultPrevented) return;
    var d=sm.parentElement; if(!d || d.tagName!=='DETAILS' || d.hasAttribute('data-sx-still') || still()) return;
    e.preventDefault();
    if(d._sx){ d._sx.cancel(); d._sx=null; }
    var from=d.offsetHeight, opening=!d.open, to;
    d.style.overflow='hidden';
    if(opening){ d.open=true; to=d.offsetHeight; }
    else { d.open=false; to=d.offsetHeight; d.open=true; }
    var a=d.animate([{height:from+'px'},{height:to+'px'}],{duration:opening?320:240,easing:E});
    d._sx=a;
    a.onfinish=function(){ d._sx=null; d.style.overflow=''; if(!opening) d.open=false; };
    a.oncancel=function(){ d.style.overflow=''; };
    if(opening){ Array.prototype.forEach.call(d.children,function(c){ if(c!==sm) c.animate([{opacity:0},{opacity:1}],{duration:260,delay:60,easing:E,fill:'backwards'}); }); }
  });

  window.SX={still:still, flip:flip, enter:enter, pill:pill, expand:expand, morph:morph, bump:bump};
})();
</script>

<script>

const CHANGELOG=[
  {v:'2026.10.27-b', note:'SNAPPIER: the Library no longer blurs behind every score badge, which made scrolling a big shelf heavy. Opening a game used to snapshot every cover on the shelf for the slide animation; now only the cover you tapped. Typing in notes and fields saves a moment after you stop instead of on every key, and search waits for a pause before redrawing the shelf.'},
  {v:'2026.10.27-a', note:'SAFER SYNC: sync used to treat your library as one block, so whichever copy saved last replaced everything. An old tab left open could put back stale versions of every game, like turning an Ongoing game back into Backlog. Now each game remembers when you last changed it, and sync merges game by game: the newer change wins for each game, and a copy can only overwrite the games it actually changed. Deleted games stay deleted on every device. A tab running an older build stops sending as soon as a newer build has saved, and asks you to reload. Restoring a backup still replaces everything everywhere. For the server side, paste the updated gamelog-sync.js into the Worker: it merges the same way, refuses saves from older builds, and keeps hourly backups for two weeks.'},
  {v:'2026.10.24-a', note:'IDEAS BUTTON: a lightbulb in the top bar opens a list for writing down features you want in this app. Tick them off or delete them. They save on this device and sync in the background, so Claude can read them. On a narrow computer window the tabs other than the current app show just their icons so the button fits.'},
  {v:'2026.10.23-a', note:'GOALS FOR BIG GAMES: games can now carry a deep checklist that lives in the repo, one file per tab, so size never bloats your synced library. Crimson Desert gets a Goals section in place of Quests, with tabs for Main Story, Side Quests, Missables, Collectibles, Pets, Armor and Power. Your old quest lists and ticks carried over. Search covers every tab, and you can filter by region, show only missables, and see what is left. Progress is weighted by estimated time once every goal has one. Each game gets a finish line: Beat it, Main + side, 100% or Shelved. CATCH-UP TOOLS: sweep a region, or mark everything before a goal as assumed. Assumed goals show lighter, tapping one confirms it, and any bulk change can be undone. CHECK-IN: when a tracked session ends, a sheet asks where you left off and what you finished. Side Quests, Pets and Armor are empty on purpose until the research pass fills them in.'},
  {v:'2026.10.22-l', note:'UPDATE BAR CHECKS WHILE THE TAB STAYS OPEN: it used to look for a new build only when the app loaded or when you came back to the tab, so a tab you left open and in view never heard about updates. Now it checks every two minutes while visible. The very first time you need to reload by hand to get this build.'},
  {v:'2026.10.22-k', note:'ONGOING GAMES CAN TAKE THE BIG SPOT: the big section on Continue picked only from Playing and Paused games, so a live service game like The Finals could never be the most recent one. Now every game that is Playing, Paused or Ongoing (and not Lapsed) is ranked by when you last played it, and the top one is featured. An Ongoing game shows its Active tag, peak rank and seasons there instead of a finish line.'},
  {v:'2026.10.22-j', note:'CONTINUE IS ABOUT YOUR LAST GAME: the big section is now always the game you are playing right now, or else the one you played most recently. It no longer jumps to a game just because it has a release coming up. It also shows more of what is left: open missables first, then what remains in Story, Power and Checklist with how far through each you are. A release for that same game shows as a small line at the bottom, and all upcoming releases stay in Coming up.'},
  {v:'2026.10.22-i', note:'PLAYING NOW TAKES THE BIG SPOT: when a Steam game is open, it moves into the large section at the top of Continue, with a Playing now heading and the time it started, even if it was Paused, Backlog, Ongoing or Finished. When you close it, Continue goes back to its normal pick: the game with the nearest release, otherwise the one you have left alone longest.'},
  {v:'2026.10.22-h', note:'PLAY STARTS A SESSION AT ONCE: after you press Play, Game Log asks the Worker to check Steam every few seconds, so \u201cPlaying now\u201d appears as soon as the game opens, dated from your click. Needs the updated Worker file, pasted in the same way as before.'},
  {v:'2026.10.22-g', note:'EXACT PLAY TIMES + SESSIONS: Game Log now keeps the exact time you last played, not just the day, so two games from the same day sort in the right order. With the Worker\u2019s new once-a-minute check, it also notices when a Steam game opens and closes and shows how long each session ran. You need to paste the updated Worker and add its second cron schedule for that part (steps are at the top of the Worker file).'},
  {v:'2026.10.22-f', note:'REMEMBERS YOUR SORT: the Library now keeps whatever you last sorted by, like Recently played, and opens that way next time until you change it. It is remembered separately on each device.'},
  {v:'2026.10.22-e', note:'ONGOING GAMES: live service games like The Finals now have their own Ongoing status, so they stop pretending to be Playing. An Active, Dormant or Lapsed tag sets itself from your last played date: Active is within 14 days, Dormant is up to 90 days, Lapsed is longer. Tap I played today on the game\u2019s Save point page to keep it fresh. Ongoing games track a peak rank or milestone and seasons played instead of a finish line, and still get the New since you left tag for patches. Lapsed ones leave Continue on their own but stay in your Library.'},
  {v:'2026.10.22-d', note:'PLAY BUTTON: every Steam game now has a Play button next to its status. It opens the game through Steam on the PC you are using, so it shows up on computers only. The first time, your browser asks to open Steam; tick the box to always allow it.'},
  {v:'2026.10.22-c', note:'TRAILERS PLAY IN THE APP: tap a trailer in the Store page section and it plays right there, on phones and computers. If a trailer can\u2019t play it opens on Steam instead.'},
  {v:'2026.10.22-b', note:'STORE PAGE: every Steam game has a new Store page section with the game\u2019s description, developer and publisher, release date, genres, Steam review score, Metacritic score, current price and sale, trailers and screenshots, PC requirements, languages and its DLC. Upcoming DLC has a Track button that adds it to Releases with a countdown. Your Worker needs the updated gamelog-sync.js for this.'},
  {v:'2026.10.22-a', note:'WHAT\u2019S NEW: every Steam game has a new What\u2019s new section with its recent patch notes and announcements. If something was posted after you last played and you have not opened that section yet, the game gets a gold \u201cNew since you left\u201d tag. Opening the section clears it on all your devices. Your Worker needs the updated gamelog-sync.js for this.'},
  {v:'2026.10.21-e', note:'FULL COVER ART: covers now use the same tall shape as Steam box art, so titles at the top are no longer cut off. Your score moved to the bottom corner so it stops sitting on top of the game\u2019s logo.'},
  {v:'2026.10.21-d', note:'PLAYBACK JOINS THE SUITE: your music and TV/film log now sits in the top bar and the app grid, with its teal cassette icon. On a computer it is the last tab across the top; on a phone it is in the grid.'},
  {v:'2026.10.21-c', note:'NEW LIFT ICON: Lift\u2019s tile in the app grid is redrawn so the L reads as an L \u2014 a kettlebell sits beside it instead of a plate covering its foot. Its tab in the top bar now shows a kettlebell too.'},
  {v:'2026.10.21-b', note:'YOUR OTHER APPS: the same top bar as Kitchen, Grocery, Lift, DishLog, Protocol and The Rail. On a computer every app is a tab across the top; on a phone the grid button opens them all. Game Log is in each of their switchers too.'},
  {v:'2026.10.21-a', note:'A HOME-SCREEN ICON: a gold G with a controller, in the same family as Kitchen, Grocery, Lift, DishLog and Protocol. It shows in the browser tab, the sidebar, and when you add Game Log to your home screen. NEW VERSION PROMPT: when a newer copy is on GitHub, a bar slides down from the top \u2014 tap Reload.'}

function normalize(g){

/* ---------- Change stamps ----------
   Sync used to treat the library as one blob: whichever copy saved last
   replaced everything, so an old tab that changed one thing could put back
   stale versions of every other game. Now each game carries u (when it last
   changed), a deleted game leaves a marker in state.gone {id: time}, and the
   fields outside games share state.metaU. Sync merges game by game and the
   newer side wins each game, so a stale copy can only touch what it changed. */
const GONE_KEEP = 120 * 86400000;

   itself (Steam achievement counts, the goals summary) is left out, so a
   background refresh can't make an old copy of a game look newer. */
const stampless = g => {
  const {u, ach, ...rest} = g;
  if (rest.goals && rest.goals.sum) { const {sum, ...gl} = rest.goals; rest.goals = gl; }
  return JSON.stringify(rest);
};
const META_SKIP = ['games','gone','mtime','metaU','build'];
const metaOf = s => JSON.stringify(Object.keys(s).filter(k => !META_SKIP.includes(k)).sort().map(k => [k, s[k]]));

function stamp(touchAll){
  const now = Date.now(), here = new Set();

    here.add(g.id);
    if (touchAll || snap.get(g.id) !== stampless(g)) { g.u = now; delete state.gone[g.id]; }
  }
  for (const id of snap.keys()) if (!here.has(id)) state.gone[id] = now;
  for (const id in state.gone) if (now - state.gone[id] > GONE_KEEP) delete state.gone[id];
  if (touchAll || metaOf(state) !== snapMeta) state.metaU = now;
}

/* Merge two copies of the library. Per game the newer u wins. When both
   sides have the same u (old data from before stamps existed) the copy saved
   by the newer build wins, then the one saved last. Returns the merged
   library plus whether this device learned something (local) and whether
   the server is missing something (remote). */
function mergeLib(local, remote){
  const bk = s => buildKey(s.build) || '0';
  const localTies = bk(local) !== bk(remote) ? bk(local) > bk(remote) : (local.mtime || 0) >= (remote.mtime || 0);
  const gone = Object.assign({}, remote.gone || {});
  let local_ = false, remote_ = false;
  for (const id in (local.gone || {})) if (!(gone[id] >= local.gone[id])) { gone[id] = local.gone[id]; remote_ = true; }
  const L = new Map(local.games.map(g => [g.id, g])), R = new Map(remote.games.map(g => [g.id, g]));
  const ids = [...L.keys(), ...[...R.keys()].filter(id => !L.has(id))];
  const games = [];
  for (const id of ids) {
    const l = L.get(id), r = R.get(id), lu = l ? +l.u || 0 : -1, ru = r ? +r.u || 0 : -1;
    const same = l && r && stampless(l) === stampless(r);
    const useL = !r || (l && (lu !== ru ? lu > ru : (same || localTies)));
    const g = useL ? l : r;
    if (gone[id] && gone[id] >= (+g.u || 0)) { if (l) local_ = true; if (r) remote_ = true; continue; }
    if (gone[id]) delete gone[id];
    if (!same) { if (useL) remote_ = true; else local_ = true; }
    games.push(g);
  }
  const lm = +local.metaU || 0, rm = +remote.metaU || 0;
  const metaL = lm !== rm ? lm > rm : localTies;
  const src = metaL ? local : remote, out = {};
  for (const k in src) if (!META_SKIP.includes(k)) out[k] = src[k];
  if (metaOf(local) !== metaOf(remote)) { if (metaL) remote_ = true; else local_ = true; }
  Object.assign(out, {games, gone, metaU:Math.max(lm, rm), mtime:Math.max(local.mtime || 0, remote.mtime || 0), build:BUILD});
  return {state:out, local:local_, remote:remote_};
}

const SYNC_KEY = 'gamelog_sync';

function mergeIn(remote, note){

async function readErr(r){

  try { const j = await r.json(); return (j && j.error) || `server answered ${r.status}`; } catch(e) { return `server answered ${r.status}`; }

async function pull(){
  if (!syncOn() || syncBusy) return;

  try {
    const r = await api('/');
    if (!r.ok) throw new Error(await readErr(r));
    const remote = await r.json();
    const needPush = mergeIn(remote, 'Updated from your other device');
    if (staleBuild) {}
    else if (needPush) { syncBusy = false; await push(); }
    else setStatus('ok');
  } catch(e) { setStatus('error', e.message === 'Failed to fetch' ? 'couldn\'t reach the Worker. Check the URL and your connection' : e.message); }

function schedulePush(){ if (!syncOn()) return; clearTimeout(pushT); pushT = setTimeout(push, 1200); }
async function push(retried){

    state.build = BUILD;
    const r = await api('/', {method:'PUT', body:JSON.stringify(state)});
    if (r.status === 409) {

      again = mergeIn(await r.json(), 'Merged in changes from your other device') && !retried;

    else if (r.status === 426) { const j = await r.json().catch(() => ({})); markStale(j.build || 'newer'); }
    else if (!r.ok) throw new Error(await readErr(r));

      const j = await r.json().catch(() => null);

let importing = false;
async function importSteam(all = false){
  if (!syncOn()) { toast('Connect sync first. Steam import runs through your Worker'); go(() => { view.tab = 'sync'; view.gameId = null; }); return; }
  if (importing) return;
  importing = all ? 'all' : 'recent'; render();
  try {
    const list = await steamLibrary(10, all);
    let added = 0, updated = 0;
    const nowS = Date.now() / 1000, twoWeeks = nowS - 14 * 86400, halfYear = nowS - 182 * 86400;
    for (const s of list) {
      const hours = Math.round(s.minutes / 6) / 10;
      const last = s.lastPlayed ? localDate(new Date(s.lastPlayed * 1000)) : '';
      const lastAt = s.lastPlayed ? s.lastPlayed * 1000 : 0;
      let g = state.games.find(x => x.steamId === s.id) || state.games.find(x => x.title.toLowerCase() === s.name.toLowerCase());
      if (g) {
        g.steamId = s.id; g.hours = Math.max(g.hours, hours);
        if (last > (g.lastPlayed || '')) { g.lastPlayed = last; g.lastPlayedAt = lastAt; }
        else if (last && last === g.lastPlayed && lastAt > (g.lastPlayedAt || 0)) g.lastPlayedAt = lastAt;
        if (!g.cover && (s.cover || s.header)) applyArt(g, s);
        updated++;
      } else {
        g = blankGame(s.name);
        // Recent: Playing. Played in the last ~6 months: Paused. Older or never played: Backlog
        const st = s.lastPlayed > twoWeeks ? 'playing' : (!all || s.lastPlayed > halfYear) ? 'paused' : 'backlog';
        Object.assign(g, {steamId:s.id, hours, lastPlayed:last, lastPlayedAt:lastAt, status:st});
        if (s.cover || s.header) applyArt(g, s); else g.artTried = true;
        state.games.push(g); added++;
      }
    }
    save(); render();
    const size = JSON.stringify(state).length;
    if (size > 900 * 1024) toast(`Heads up: your library is ${Math.round(size / 1024)} KB, close to the 1 MB sync limit`);
    else toast(added || updated ? `From Steam: ${added} added${updated ? `, ${updated} updated` : ''}. Details fill in automatically in the background` : 'Steam returned no games');
    if (all) { try { await api('/steam/refresh', {method:'POST'}); } catch(e) {} }
    await fetchSummary();
    const fresh = list.filter(s => s.lastPlayed > twoWeeks).slice(0, 10);
    for (const s of fresh) {
      const g = state.games.find(x => x.steamId === s.id);
      if (g && !g.ach) { try { await fetchAch(g, {quiet:true}); } catch(e) { achLoading.delete(g.id); } }
    }
  } catch(e) {
    toast(`Steam import failed: ${e.message === 'Failed to fetch' ? 'couldn\'t reach the Worker' : e.message}`);
  }
  importing = false; render();
}

/* ---------- When did I last play? ----------

}

function setGoal(g, tab, id, status){
  const G = ensureGoals(g), m = G.st[tab] = G.st[tab] || {};
  if (status) m[id] = status; else delete m[id];
  if (!Object.keys(m).length) delete G.st[tab];
  const old = legacyItem(g, id); if (old) old.done = status === 'd';
}
function afterGoals(g){ refreshSum(g); save(); render(); }
let goalUndo = null;
function bulkGoals(g, label, ops){
  if (!ops.length) { toast('Nothing to change there'); return; }
  if (ops.length > 25 && !confirm(`${label}: change ${ops.length} goals? You can undo it from Catch-up tools.`)) return;
  goalUndo = {gid:g.id, st:JSON.stringify(ensureGoals(g).st), label, n:ops.length};
  for (const [t, i, s] of ops) setGoal(g, t, i, s);
  afterGoals(g); toast(`${label}: ${ops.length} updated`);
}
function undoGoals(g){
  if (!goalUndo || goalUndo.gid !== g.id) return;
  const G = ensureGoals(g), p = PACKS[g.content];
  G.st = JSON.parse(goalUndo.st);
  if (p && p.state === 'ready') for (const t of p.man.tabs) for (const e of p.tabs[t.id]) { const old = legacyItem(g, e.id); if (old) old.done = goalSt(g, t.id, e.id) === 'd'; }
  toast(`Undid: ${goalUndo.label}`); goalUndo = null; afterGoals(g);
}

/* ---------- Derived ---------- */
function stats(g){
  if (g.content) { const ps = packStats(g); if (ps) return ps; }
  let t = 0, d = 0;
  LAYERS.forEach(([k]) => { const L = g.layers[k]; if (L.inFinish){ t += L.items.length; d += L.items.filter(i => i.done).length; } });
  return {total:t, done:d, pct: t ? Math.round(d / t * 100) : 0};
}
const openMissables = g => { const gm = g.content && goalMiss(g); return gm ? gm.n : g.missables.filter(m => !m.done).length; };
const upcoming = g => g.releases.filter(r => r.date && r.date >= localDate()).sort((a,b) => a.date.localeCompare(b.date));
function countdown(date){
  const d = daysBetween(localDate(), date);
  return d === 0 ? 'Out today' : d === 1 ? 'Tomorrow' : `In ${d} days`;
}
function since(date){
  if (!date) return 'No sessions logged';
  const d = daysBetween(date, localDate());
  return d <= 0 ? 'Played today' : d === 1 ? 'Played yesterday' : `Last played ${d} days ago`;
}
/* Ongoing (live service) games have no end state, so their health comes from
   how recently you played: Active within 14 days, Dormant up to 90, Lapsed beyond. */
const isLive = g => g.status === 'ongoing';
function activity(g){
  if (!g.lastPlayed) return {key:'lapsed', label:'Lapsed'};
  const d = daysBetween(g.lastPlayed, localDate());
  return d <= 14 ? {key:'active', label:'Active'} : d <= 90 ? {key:'dormant', label:'Dormant'} : {key:'lapsed', label:'Lapsed'};
}
const actTag = g => isLive(g) ? `<span class="acttag ${activity(g).key}" title="${esc(since(g.lastPlayed))}">${activity(g).label}</span>` : '';
const inProgress = g => g.status === 'playing' || g.status === 'paused';
const liveShown = g => isLive(g) && activity(g).key !== 'lapsed';
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- Pieces ---------- */
const ICON = {
  trophy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  play:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg>',
  shelf:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17.5 5.2l3.4 14.4"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  sync:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
  logo:'<svg width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="4" width="15" height="20" rx="3" fill="#3B2A6B"/><rect x="3" y="4" width="3" height="20" rx="1.5" fill="#F5B63F"/><rect x="10" y="4" width="15" height="20" rx="3" fill="#F5B63F" opacity=".9"/><path d="M15 11l6 3-6 3z" fill="#161A33"/></svg>'
};

/* Only the game being opened (or just closed) gets a view-transition name.
   Naming every cover made the browser snapshot the whole shelf on each tap. */
let vtId = null;
function coverHTML(g, opts = {}){
  const st = stats(g);
  const vt = opts.vt === false || g.id !== vtId ? '' : `view-transition-name:cv-${g.id};`;
  const url = /^https:\/\/[^\s"'<>]+$/.test(g.cover) ? g.cover : '';
  const h = hash(g.title), [a, b] = paletteFor(g), ang = 20 + (h >> 4) % 140, x = 15 + (h >> 9) % 70;
  const bg = `background:radial-gradient(110% 70% at ${x}% 8%,${b}cc 0%,transparent 58%),repeating-linear-gradient(${ang}deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px),linear-gradient(165deg,${a} 10%,#12152B 95%);`;
  const wide = url && !/library_600x900/.test(url);
  return `<div class="cover ${url ? 'img' : ''} ${wide ? 'wide' : ''}" style="${bg}${vt}">
    <div class="spine"></div>
    ${url ? `<img class="art" src="${esc(url)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove('img','wide');this.remove()">` : ''}
    <div class="ct">${esc(g.title)}</div>
    ${opts.score && g.rating ? `<div class="score" aria-label="Score ${g.rating} out of 10">${g.rating}</div>` : ''}
    ${opts.bar !== false && st.total && !isLive(g) ? `<div class="bar"><i style="width:${st.pct}%"></i></div>` : ''}
  </div>`;
}

function pips(g, cls = ''){
  return `<div class="pips ${cls}">
    <div class="pip-row" role="radiogroup" aria-label="Score out of 10">
      ${Array.from({length:10}, (_, i) => `<button class="pip ${i < g.rating ? 'on' : ''}" role="radio" aria-checked="${i + 1 === g.rating}" aria-label="${i + 1}, ${SCORE_WORD[i + 1]}" data-act="rate" data-v="${i + 1}"></button>`).join('')}
    </div>
    <div class="val">${g.rating ? `<b>${g.rating}<small>/10</small></b><span>${SCORE_WORD[g.rating]}</span>` : `<b class="dim" style="font-size:16px;font-weight:600">Not scored</b><span>Tap to score</span>`}</div>
  </div>`;
}

function liveStat(g){
  const a = activity(g);
  const bits = [since(g.lastPlayed), g.seasons ? `${g.seasons} season${g.seasons > 1 ? 's' : ''}` : '', g.peak ? esc(g.peak) : ''].filter(Boolean);
  return `<div class="ring"><div><b class="actc ${a.key}">${a.label}</b><span>${bits.join(' · ')}</span></div></div>`;
}

function ring(st, kind = 'quests'){
  const r = 24, c = 2 * Math.PI * r, off = c * (1 - st.pct / 100), col = kind === 'quests' ? '#F5B63F' : '#62D6B8';
  return `<div class="ring">
    <svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" fill="none" stroke="#2A3160" stroke-width="6"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 30 30)"/></svg>
    <div><b>${st.pct}%</b><span>${kind === 'quests' ? (st.shelved ? 'Shelved, not counting progress' : st.total ? `${st.done} of ${st.total} goals to your finish line` : 'No finish line set yet') : `${st.done} of ${st.total} Steam achievements`}</span></div>
  </div>`;
}

function checklist(arr, kind, layer, placeholder){
  return `<ul class="checks">${arr.map(i => `<li class="${i.done ? 'done' : ''}">
      <input class="tick" type="checkbox" ${i.done ? 'checked' : ''} aria-label="Mark done: ${esc(i.text)}" data-act="toggle" data-kind="${kind}" data-layer="${layer || ''}" data-id="${i.id}">
      <span class="t">${esc(i.text)}</span>
      <button class="rm" aria-label="Remove ${esc(i.text)}" data-act="del" data-kind="${kind}" data-layer="${layer || ''}" data-id="${i.id}">${ICON.x}</button>
    </li>`).join('')}</ul>
    <div class="adder"><input type="text" id="add-${kind}-${layer || 'x'}" placeholder="${placeholder}" data-enter="add" data-kind="${kind}" data-layer="${layer || ''}">
    <button class="btn quiet sm" data-act="add" data-kind="${kind}" data-layer="${layer || ''}">Add</button></div>`;
}

/* ---------- Chrome ---------- */

/* ---------- Continue ---------- */
function renderContinue(){
  // A game open right now always belongs on Continue, whatever its status
  const nowG = playNow ? state.games.find(g => g.steamId && g.steamId === playNow.a) : null;
  // Everything that can take the big spot: Playing, Paused, Ongoing (not lapsed), or open right now
  const pool = state.games.filter(g => inProgress(g) || liveShown(g) || g === nowG).sort((a, b) => playedKey(b) - playedKey(a));
  if (!pool.length) return `<div class="page">
    <h1 class="h1">Continue</h1><p class="lede">Games you're playing or have paused show up here with your save point, so coming back is easy. Live service games go here too once they are set to Ongoing.</p>
    <div class="empty"><b>Nothing in progress</b>Open a game in your library and set it to Playing, Paused or Ongoing.<div class="actions" style="justify-content:center"><button class="btn" data-act="tab" data-tab="library">Go to library</button></div></div></div>`;
  const allUp = state.games.flatMap(g => upcoming(g).map(r => ({g, r}))).sort((a,b) => a.r.date.localeCompare(b.r.date));
  const upSection = allUp.length ? `<h2 class="h2">Coming up</h2><div class="timeline">${allUp.map(({g, r}) => `
      <button class="tl" data-act="open" data-id="${g.id}" data-section="releases">
        <div class="day">${new Date(r.date + 'T00:00').getDate()}<small>${fmtDate(r.date, {month:'short', year:'numeric'})}</small></div>
        <div class="what"><b>${esc(r.name)}</b><span>${esc(g.title)}</span></div>
        <div class="cd">${countdown(r.date)}</div>
      </button>`).join('')}</div>` : '';
  // Feature: the game you're playing right now, otherwise the one you played most recently
  const f = pool[0], rest = pool.slice(1), st = stats(f), rel = upcoming(f)[0], miss = openMissables(f);
  const isLiveF = isLive(f);
  const restPlay = rest.filter(g => !isLive(g)), live = rest.filter(isLive);
  const liveSection = live.length ? `<h2 class="h2">Ongoing</h2><div class="shelf" style="margin-bottom:44px">${live.map(slot).join('')}</div>` : '';
  // What's left, by layer, so you can see the whole shape of the game
  if (f.content && !PACKS[f.content]) loadPack(f);   // refreshes the goal summary in the background
  const packTodo = f.content ? goalTodo(f) : null;
  const todo = packTodo ? packTodo.slice(0, 4).map(x => ({k:'', label:x.label, open:x.open, total:x.total, done:x.done, more:x.left - Math.min(4, x.open.length), where:'Goals'}))
    : LAYERS.map(([k, label]) => {
      const L = f.layers[k], open = L.items.filter(i => !i.done);
      return {k, label, open:open.map(i => ({id:i.id, text:i.text, kind:'item'})), total:L.items.length, done:L.items.length - open.length, more:open.length - 4, where:'Quests'};
    }).filter(x => x.open.length);
  const gm = f.content ? goalMiss(f) : null;
  const openMiss = gm ? gm.items : f.missables.filter(m => !m.done).map(m => ({id:m.id, text:m.text, kind:'miss'}));
  const missMore = (gm ? gm.n : openMiss.length) - 4;

  return `<div class="page">
    <h1 class="h1">${f === nowG ? 'Playing now' : 'Pick up where you left off'}</h1>
    <p class="lede">${f === nowG ? `You've had ${esc(f.title)} open since ${fmtClock(playNow.s)}. Here's where you stand.` : `${esc(f.title)} is the last game you played. ${esc(since(f.lastPlayed))}. Here's where you stand.`}</p>

    <section class="feature" aria-label="${esc(f.title)}">
      <button class="slot" data-act="open" data-id="${f.id}" aria-label="Open ${esc(f.title)}">${coverHTML(f, {score:true})}</button>
      <div>
        <h2>${esc(f.title)}</h2>
        <div class="meta"><span>${LABEL[f.status]}</span><span>${f === nowG ? `Playing now · since ${fmtClock(playNow.s)}` : since(f.lastPlayed)}</span>${isLiveF ? `${actTag(f)}${f.peak ? `<span>${esc(f.peak)}</span>` : ''}${f.seasons ? `<span>${f.seasons} season${f.seasons > 1 ? 's' : ''}</span>` : ''}` : `<span>${st.pct}% to finish line</span>`}${miss ? `<span class="alert">${miss} missable${miss > 1 ? 's' : ''} open</span>` : ''}${newTag(f)}</div>
        ${f.note.where || f.note.next ? `<div class="save">
          <div><h4>Where you were</h4><p>${esc(f.note.where) || '<span class="dim">Not written yet</span>'}</p></div>
          <div class="next"><h4>Next step</h4><p>${esc(f.note.next) || '<span class="dim">Not written yet</span>'}</p></div>
        </div>` : ''}
        ${openMiss.length ? `<div class="upnext"><h4>Don't miss</h4><ul class="checks">${openMiss.slice(0, 4).map(m => `<li>
          <input class="tick" type="checkbox" aria-label="Mark done: ${esc(m.text)}" data-act="toggle" data-kind="${m.kind}" data-tab="${esc(m.tab || '')}" data-id="${esc(m.id)}" data-game="${f.id}">
          <span class="t">${esc(m.text)}</span><span></span></li>`).join('')}</ul>${missMore > 0 ? `<p class="dim" style="margin:6px 0 0;font-size:13px">+${missMore} more in ${gm ? 'Goals' : 'Missables'}</p>` : ''}</div>` : ''}
        ${todo.map(x => `<div class="upnext"><h4>${esc(x.label)} · ${x.done} of ${x.total} done</h4><ul class="checks">${x.open.slice(0, 4).map(i => `<li>
          <input class="tick" type="checkbox" aria-label="Mark done: ${esc(i.text)}" data-act="toggle" data-kind="${i.kind}" data-tab="${esc(i.tab || '')}" data-layer="${x.k}" data-id="${esc(i.id)}" data-game="${f.id}">
          <span class="t">${esc(i.text)}</span><span></span></li>`).join('')}</ul>${x.more > 0 ? `<p class="dim" style="margin:6px 0 0;font-size:13px">+${x.more} more in ${x.where}</p>` : ''}</div>`).join('')}
        ${rel ? `<p class="dim" style="margin:14px 0 0;font-size:13px">${esc(rel.name)} ${countdown(rel.date).toLowerCase()}</p>` : ''}
        <div class="actions">
          <button class="btn" data-act="open" data-id="${f.id}">Open game</button>
          <button class="btn quiet" data-act="played" data-game="${f.id}">I played today</button>
          ${/^https?:\/\//.test(f.note.recap) ? `<a class="btn quiet" href="${esc(f.note.recap)}" target="_blank" rel="noopener">Watch recap</a>` : ''}
        </div>
      </div>
    </section>

    ${restPlay.length ? `<h2 class="h2">Also in progress</h2><div class="shelf" style="margin-bottom:44px">${restPlay.map(slot).join('')}</div>` : ''}

    ${liveSection}

    ${upSection}
  </div>`;
}

function slot(g){
  const st = stats(g);
  return `<button class="slot" data-act="open" data-id="${g.id}">
    ${coverHTML(g, {score:true})}
    <div><div class="lbl">${esc(g.title)}</div>
    <div class="sub"><span>${LABEL[g.status]}</span>${actTag(g)}${isLive(g) ? (g.peak ? `<span>${esc(g.peak)}</span>` : '') : st.total ? `<span>${st.pct}%</span>` : ''}${achPct(g) !== null ? `<span class="achchip" title="${g.ach.done} of ${g.ach.total} achievements">${ICON.trophy}${achPct(g)}%</span>` : ''}${newTag(g)}</div></div>
  </button>`;
}

/* ---------- Library ---------- */
function renderLibrary(){
  const q = view.q.toLowerCase();
  const sorters = {
    title:(a,b) => a.title.localeCompare(b.title),
    score:(a,b) => b.rating - a.rating || a.title.localeCompare(b.title),
    recent:(a,b) => playedKey(b) - playedKey(a) || a.title.localeCompare(b.title),
    progress:(a,b) => stats(b).pct - stats(a).pct
  };
  const list = state.games.filter(g => (view.filter === 'all' || g.status === view.filter) && g.title.toLowerCase().includes(q)).sort(sorters[view.sort]);
  const count = s => s === 'all' ? state.games.length : state.games.filter(g => g.status === s).length;
  return `<div class="page">
    <div class="libhead">
      <div><h1 class="h1">Library</h1><p class="lede" style="margin:0">${state.games.length} game${state.games.length === 1 ? '' : 's'}, scored out of 10.</p></div>
      <div class="addgame"><input type="text" id="newTitle" placeholder="Add a game by title" aria-label="Game title"><button class="btn" data-act="add-game">Add game</button><button class="btn quiet" data-act="steam-import" ${importing ? 'disabled' : ''}>${importing ? 'Importing…' : 'Import from Steam'}</button></div>

      <input type="search" class="search" id="search" placeholder="Search titles" value="${esc(view.q)}" aria-label="Search titles">
      <select id="sort" aria-label="Sort">${[['title','Title A–Z'],['score','Highest score'],['recent','Recently played'],['progress','Most progress']].map(([v,l]) => `<option value="${v}" ${view.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${list.length ? `<div class="shelf">${list.map(slot).join('')}</div>`
      : `<div class="empty"><b>${state.games.length ? 'No matches' : 'Your shelf is empty'}</b>${state.games.length ? 'Try another filter or search.' : 'Add your first game with the field above.'}</div>`}
  </div>`;
}
