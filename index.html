        <p>Importing the whole library sorts games by when you last played: the last two weeks go to Playing, the last six months to Paused, everything else to Backlog. Store pages, trailers, achievements and patch notes then fill in on their own and stay up to date.</p>
        <div class="actions" style="margin-top:0">
          <button class="btn" data-act="steam-import-all" ${importing || !syncOn() ? 'disabled' : ''}>${importing === 'all' ? 'Importing…' : 'Import whole library'}</button>
          <button class="btn quiet" data-act="steam-import" ${importing || !syncOn() ? 'disabled' : ''}>${importing === 'recent' ? 'Importing…' : 'Import 10 recent games'}</button>
        </div>
        ${steamStatusHtml()}
      </section>
      <section class="panel">
        <h2 class="h2" style="margin:0">Backups</h2>
        <p>The Worker also keeps the copy before your latest save. For a file you control, download a backup now and then.</p>
        <div class="actions" style="margin-top:0">
          <button class="btn quiet" data-act="export">Download backup</button>
          <button class="btn quiet" data-act="import">Restore from file</button>
        </div>
      </section>
      <section class="panel">
        <h2 class="h2" style="margin:0">This version</h2>
        <p class="buildid">Build ${esc(BUILD)}</p>
        <p><b>New:</b> ${esc(CHANGELOG[0].note)}</p>
        ${CHANGELOG.length > 1 ? `<ul class="hist">${CHANGELOG.slice(1).map(c => `<li><code>${esc(c.v)}</code>${esc(c.note)}</li>`).join('')}</ul>` : ''}
      </section>
    </div>
  </div>`;
}

/* ---------- Game ---------- */
/* Steam launch: steam://run/<appid> hands off to the Steam client on this PC.
   Only offered on computers; a phone or tablet has no Steam client to open. */
const CAN_LAUNCH = !/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
function playBtn(g){
  const id = Math.floor(Number(g.steamId));
  if (!CAN_LAUNCH || !(id > 0)) return '';
  return `<a class="btn play" href="steam://run/${id}" data-act="launch" aria-label="Play ${esc(g.title)} in Steam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>Play</a>`;
}
const SECTIONS = [['save','Save point'],['quests','Quests'],['goals','Goals'],['achievements','Achievements'],['news','What\u2019s new'],['store','Store page'],['missables','Missables'],['releases','Releases'],['review','Review & details']];

function renderGame(g){
  const st = stats(g), miss = openMissables(g), ups = upcoming(g).length;
  const hasPack = !!g.content;
  const sec = hasPack && (view.section === 'quests' || view.section === 'missables') ? 'goals' : !hasPack && view.section === 'goals' ? 'quests' : view.section;
  const badge = {quests: st.total - st.done, goals: st.total - st.done, missables: miss, releases: ups, achievements: g.ach && g.ach.total ? g.ach.total - g.ach.done : 0, news: newCount(g)};
  const tint = paletteFor(g);
  return `
  <header class="hero">
    ${/^https:\/\//.test(g.hero) ? `<div class="hero-img" style="background-image:url('${esc(g.hero)}')"></div>` : `<div class="hero-bg" style="background:radial-gradient(60% 80% at 20% 30%,${tint[1]}66,transparent 70%),radial-gradient(50% 70% at 70% 20%,${tint[0]},transparent 70%)"></div>`}
    <div class="hero-in">
      ${coverHTML(g, {bar:false})}
      <div>
        <button class="back" data-act="back">${ICON.back}${view.tab === 'library' ? 'Library' : 'Continue'}</button>
        <h1>${esc(g.title)}</h1>
        <div class="hero-row">
          ${playBtn(g)}
          <select class="status-pick" data-f="status" data-rerender="1" aria-label="Status">${STATUSES.map(s => `<option value="${s}" ${g.status === s ? 'selected' : ''}>${LABEL[s]}</option>`).join('')}</select>
          ${isLive(g) ? liveStat(g) : ring(st)}
          ${achPct(g) !== null ? `<button data-act="section" data-s="achievements" aria-label="Open achievements" style="border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer">${ring({total:g.ach.total, done:g.ach.done, pct:achPct(g)}, 'achievements')}</button>` : ''}
          ${pips(g)}
          ${newTag(g, 'button')}
        </div>
      </div>
    </div>
  </header>
  <nav class="sections" aria-label="Game sections"><div class="sections-in">
    ${SECTIONS.filter(([k]) => k === 'goals' ? hasPack : (k === 'quests' || k === 'missables') ? !hasPack : (!['achievements','news','store'].includes(k) || g.steamId)).map(([k, l]) => `<button class="sec ${sec === k ? 'on' : ''}" data-act="section" data-s="${k}" aria-current="${sec === k}">${l}${badge[k] ? `<span class="n ${k === 'missables' ? 'warn' : k === 'news' ? 'new' : ''}">${badge[k]}</span>` : ''}</button>`).join('')}
  </div></nav>
  <div class="page">${({save:secSave, quests:secQuests, goals:secGoals, achievements:secAch, news:secNews, store:secStore, missables:secMissables, releases:secReleases, review:secReview})[sec](g)}</div>`;
}

function sessLine(g){
  if (playNow && g.steamId && playNow.a === g.steamId) return `<p class="achlast"><b>Playing now</b> <span class="dim">· started ${fmtClock(playNow.s)}</span></p>`;
  const last = g.sessions[g.sessions.length - 1];
  if (!last) return '';
  const total = g.sessions.reduce((n, x) => n + (x.e - x.s), 0);
  const day = localDate(new Date(last.s)) === localDate() ? 'today' : fmtDate(localDate(new Date(last.s)), {month:'short', day:'numeric'});
  return `<p class="achlast">Last session: <b>${fmtDur(last.e - last.s)}</b> <span class="dim">· ${day}, ${fmtClock(last.s)} to ${fmtClock(last.e)}${g.sessions.length > 1 ? ` · ${fmtDur(total)} tracked over ${g.sessions.length} sessions` : ''}</span></p>`;
}

function secSave(g){
  return `
    <div class="played">
      <p><b>${since(g.lastPlayed)}</b>${g.lastPlayed ? ` <span class="dim">(${fmtDate(g.lastPlayed)})</span>` : ''}</p>
      <button class="btn quiet sm" data-act="played">I played today</button>
    </div>
    ${sessLine(g)}
    <p style="margin:0 0 16px"><button class="btn quiet sm" data-act="ck-open">${g.sessions.length ? 'Check in on last session' : 'Check in now'}</button></p>
    ${g.ach && g.ach.last ? `<p class="achlast">Last achievement: <b>${esc(g.ach.last.name)}</b> <span class="dim">· ${fmtDate(localDate(new Date(g.ach.last.time * 1000)))}</span></p>` : ''}
    <div class="journal">
      <div class="panel">
        <h3>Where I was</h3><p class="hint">Chapter, area, what you were in the middle of.</p>
        <textarea data-f="note.where" aria-label="Where I was" placeholder="Write it before you put the game down.">${esc(g.note.where)}</textarea>
      </div>
      <div class="panel next">
        <h3>Next step when I'm back</h3><p class="hint">The first thing to do so you don't stall out.</p>
        <textarea data-f="note.next" aria-label="Next step" placeholder="One clear thing to start with.">${esc(g.note.next)}</textarea>
      </div>
    </div>
    <div class="panel">
      <div class="stats">
        <div class="field"><label for="f-recap">Story recap link</label><input type="url" id="f-recap" data-f="note.recap" value="${esc(g.note.recap)}" placeholder="https://youtube.com/…"></div>
        <div class="field"><label for="f-hours">Hours played</label><input type="number" id="f-hours" min="0" step="0.5" data-f="hours" data-num="1" value="${g.hours || ''}"></div>
        <div class="field"><label for="f-last">Last played</label><input type="date" id="f-last" data-f="lastPlayed" value="${g.lastPlayed}"></div>
        ${isLive(g) ? `<div class="field"><label for="f-peak">Peak rank or milestone</label><input type="text" id="f-peak" data-f="peak" value="${esc(g.peak)}" placeholder="Diamond, Season 4 finisher…"></div>
        <div class="field"><label for="f-seasons">Seasons played</label><input type="number" id="f-seasons" min="0" step="1" data-f="seasons" data-num="1" value="${g.seasons || ''}"></div>` : ''}
      </div>
    </div>`;
}

function secAch(g){
  const c = achCache[g.steamId], loading = achLoading.has(g.id);
  if (!syncOn()) return `<div class="empty"><b>Connect sync to load achievements</b>Achievements come from Steam through your Worker.<div class="actions" style="justify-content:center"><button class="btn" data-act="tab" data-tab="sync">Go to Sync</button></div></div>`;
  if (!c || !c.items) return c && c.err && !loading
    ? `<div class="empty"><b>Couldn't load achievements</b>${esc(c.err)}<div class="actions" style="justify-content:center"><button class="btn" data-act="ach-refresh">Try again</button></div></div>`
    : `<div class="empty"><b>Loading achievements</b>Asking Steam for ${esc(g.title)}.</div>`;
  if (!c.items.length) return `<div class="empty"><b>No Steam achievements</b>${esc(g.title)} doesn't have achievements on Steam. Use Quests to track your own finish line.</div>`;

  const items = c.items, done = items.filter(i => i.done).length, pct = Math.floor(done / items.length * 100);
  const f = view.achFilter || 'locked', sort = view.achSort || 'common';
  const rarestDone = items.filter(i => i.done && i.pct !== null).sort((a, b) => a.pct - b.pct)[0];
  let list = items.filter(i => f === 'all' || (f === 'locked' ? !i.done : i.done));
  const sorters = {
    common:(a, b) => (b.pct ?? -1) - (a.pct ?? -1),
    rare:(a, b) => (a.pct ?? 101) - (b.pct ?? 101),
    recent:(a, b) => b.time - a.time,
    name:(a, b) => a.name.localeCompare(b.name)
  };
  list = [...list].sort(sorters[sort]);
  const hiddenLeft = items.filter(i => i.hidden && !i.done).length;
  const mins = Math.round((Date.now() - c.fetched) / 60000);
  const ago = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins / 60)} h ago` : fmtDate(localDate(new Date(c.fetched)));
  return `
    <div class="achsum">
      <div class="big">${done}<small> / ${items.length}</small></div>
      <div>
        <div class="meter" role="img" aria-label="${pct}% of achievements unlocked"><i style="width:${pct}%"></i></div>
        <p>${pct}% unlocked${rarestDone ? ` · Rarest: <b style="color:var(--paper)">${esc(rarestDone.name)}</b> (${rarestDone.pct}% of players)` : ''}${hiddenLeft ? ` · ${hiddenLeft} hidden still locked` : ''}</p>
      </div>
    </div>
    <div class="achtools">
      <div class="seg" role="tablist" aria-label="Filter achievements">${[['locked','Locked'],['done','Unlocked'],['all','All']].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="ach-filter" data-v="${k}">${l}<span class="n">${k === 'all' ? items.length : k === 'done' ? done : items.length - done}</span></button>`).join('')}</div>
      <select id="achSort" aria-label="Sort achievements">${[['common','Most common first'],['rare','Rarest first'],['recent','Recently unlocked'],['name','Name A–Z']].map(([v, l]) => `<option value="${v}" ${sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="grow"></span>
      <span class="dim" style="font-size:13px">${loading ? 'Refreshing…' : c.err ? `<span class="err">Last refresh failed: ${esc(c.err)}</span>` : `Updated ${ago}`}</span>
      <button class="btn quiet sm" data-act="ach-refresh" ${loading ? 'disabled' : ''}>Refresh</button>
    </div>
    ${list.length ? `<ul class="achlist">${list.map(i => {
      const masked = i.hidden && !i.done && !(view.reveal && view.reveal.has(i.id));
      return `<li class="${i.done ? '' : 'locked'}">
        <img src="${/^https:\/\//.test(i.icon) ? esc(i.icon) : ''}" alt="" loading="lazy">
        <div>${masked ? `<b>Hidden achievement</b><span class="d">Might spoil the story. <button class="reveal" data-act="ach-reveal" data-id="${esc(i.id)}">Reveal</button></span>`
          : `<b>${esc(i.name)}</b><span class="d">${esc(i.desc) || (i.hidden ? '<span class="dim">No description (hidden)</span>' : '')}</span>`}</div>
        <div class="r">${i.pct !== null ? `<b class="${i.pct < 10 ? 'rare' : ''}">${i.pct}%</b><br>of players` : ''}${i.done && i.time ? `<br>${fmtDate(localDate(new Date(i.time * 1000)))}` : ''}</div>
      </li>`; }).join('')}</ul>`
      : `<div class="empty"><b>${f === 'locked' ? 'All achievements unlocked' : 'Nothing unlocked yet'}</b>${f === 'locked' ? '100% on Steam. Nice.' : 'Your first one will show up here.'}</div>`}`;
}

function secQuests(g){
  return `
    <p class="quest-note">Decide what "done" means before you start. Layers marked <b>Counts</b> make up your finish line; the rest are optional and never hold your progress back.</p>
    <div class="layers">
      ${LAYERS.map(([k, name, desc]) => {
        const L = g.layers[k], d = L.items.filter(i => i.done).length, pct = L.items.length ? d / L.items.length * 100 : 0;
        return `<section class="panel layer ${L.inFinish ? '' : 'opt'}">
          <div class="layer-top"><h3>${name}</h3>
            <button class="counts ${L.inFinish ? 'on' : ''}" data-act="layer" data-layer="${k}" aria-pressed="${L.inFinish}">${L.inFinish ? 'Counts' : 'Optional'}</button></div>
          <p class="desc">${desc}</p>
          <div class="lbar"><i style="width:${pct}%"></i></div>
          <div class="dim" style="font-size:13px;margin-bottom:4px">${d} of ${L.items.length} done</div>
          ${checklist(L.items, 'item', k, `Add a ${name.toLowerCase()} quest`)}
        </section>`; }).join('')}
    </div>`;
}

function goalView(){
  return view.goals || (view.goals = {tab:'', q:'', region:'', show:'left', miss:false, limit:GOAL_PAGE, open:new Set(), tools:false, swRegion:'', swScope:'tab'});
}
const VERIFY_LABEL = {sourced:'Sourced', user:'Your note', unsourced:'Unsourced', confirmed:'Confirmed in-game'};

function goalRegions(p){
  const set = new Set();
  for (const t of p.man.tabs) for (const e of p.tabs[t.id]) if (e.region) set.add(e.region);
  return [...set].sort((a, b) => a.localeCompare(b));
}

function goalRow(g, e, o){
  const V = goalView(), s = goalSt(g, e.tab, e.id), open = V.open.has(e.tab + '\u0001' + e.id);
  const ver = s === 'd' && e.verified === 'sourced' ? 'confirmed' : e.verified;
  const flag = g.goals.flag[e.id];
  const chips = [
    o.next ? '<span class="gchip next">Next up</span>' : '',
    o.showTab ? `<span class="gchip">${esc(o.tabName)}</span>` : '',
    e.region ? `<span class="gchip">${esc(e.region)}</span>` : '',
    e.mins ? `<span class="gchip">~${e.mins < 60 ? e.mins + ' min' : (Math.round(e.mins / 6) / 10) + ' h'}</span>` : '',
    e.missable ? '<span class="gchip warn">Missable</span>' : '',
    s === 'a' ? '<span class="gchip as">Assumed, tap to confirm</span>' : '',
    ver === 'confirmed' ? `<span class="gchip ok">${VERIFY_LABEL[ver]}</span>` : '',
    flag ? '<span class="gchip warn">Flagged</span>' : ''
  ].join('');
  const det = open ? `<div class="gdet">
      ${e.how ? `<div><b>How</b><div class="how">${esc(e.how)}</div></div>` : '<div><b>How</b> No steps written yet.</div>'}
      ${e.prereq ? `<div><b>Needs</b> ${esc(e.prereq)}</div>` : ''}
      ${e.unlocks ? `<div><b>Unlocks</b> ${esc(e.unlocks)}</div>` : ''}
      ${e.sources.length ? `<div><b>Sources</b> ${e.sources.map(x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join(' · ')}</div>` : ''}
      <div><b>Data</b> ${VERIFY_LABEL[ver]}${ver === 'sourced' ? '. Becomes confirmed when you tick it off in-game.' : ver === 'unsourced' ? '. No source attached yet.' : ''}</div>
      <label for="fl-${esc(e.id)}"><b>This looks wrong</b></label>
      <textarea id="fl-${esc(e.id)}" data-goalnote="${esc(e.id)}" placeholder="Say what is off. It is saved with this goal for the next data pass.">${esc(flag || '')}</textarea>
      <div class="acts">
        <button class="btn quiet sm" data-act="goal-above" data-tab="${esc(e.tab)}" data-id="${esc(e.id)}">Assume everything before this is done</button>
        ${s ? `<button class="btn quiet sm" data-act="goal-clear" data-tab="${esc(e.tab)}" data-id="${esc(e.id)}">Mark not done</button>` : ''}
      </div>
    </div>` : '';
  return `<li class="${s}">
    <button class="gtick ${s}" data-act="goal" data-tab="${esc(e.tab)}" data-id="${esc(e.id)}" aria-pressed="${s === 'd'}" aria-label="${s === 'd' ? 'Done' : s === 'a' ? 'Assumed done, confirm' : 'Mark done'}: ${esc(e.name)}"></button>
    <div><div class="gname">${esc(e.name)}</div><div class="gchips">${chips}</div>${det}</div>
    <button class="btn quiet sm gmore" data-act="goal-open" data-tab="${esc(e.tab)}" data-id="${esc(e.id)}" aria-expanded="${open}">${open ? 'Less' : 'Details'}</button>
  </li>`;
}

function secGoals(g){
  const p = PACKS[g.content], V = goalView();
  if (!p || p.state === 'loading') { if (!p) loadPack(g); return `<div class="empty"><b>Loading goals</b>Fetching the checklist for ${esc(g.title)}.</div>`; }
  if (p.state === 'err') return `<div class="empty"><b>Couldn't load goals</b>${esc(p.err)}<div class="actions" style="justify-content:center"><button class="btn" data-act="goal-retry">Try again</button></div></div>`;
  const G = ensureGoals(g), tabs = p.man.tabs;
  if (!V.tab || !tabs.some(t => t.id === V.tab)) V.tab = (tabs.find(t => p.tabs[t.id].length) || tabs[0]).id;
  const tab = tabs.find(t => t.id === V.tab), entries = p.tabs[tab.id], st = stats(g), f = g.finish || 'beat';
  const tcount = id => { const m = G.st[id] || {}; return p.tabs[id].reduce((n, e) => n + (m[e.id] ? 1 : 0), 0); };
  const q = V.q.trim().toLowerCase(), searching = !!q;
  const stOf = e => (G.st[e.tab] || {})[e.id] || '';

  // Rows: the current tab, or every tab while searching
  let rows = (searching ? tabs.flatMap(t => p.tabs[t.id]) : entries).filter(e => {
    const s = stOf(e);
    if (V.show === 'left' && s) return false;
    if (V.show === 'assumed' && s !== 'a') return false;
    if (V.show === 'done' && s !== 'd') return false;
    if (V.region && e.region !== V.region) return false;
    if (V.miss && !e.missable) return false;
    return !q || (e.name + ' ' + e.region + ' ' + e.how).toLowerCase().includes(q);
  });
  const total = rows.length, shown = rows.slice(0, V.limit);
  const tabName = id => (tabs.find(t => t.id === id) || {}).name || '';
  const nextN = V.show === 'left' && !searching && !V.region && !V.miss ? 3 : 0;

  const regions = goalRegions(p);
  const counted = tabs.filter(t => p.tabs[t.id].length && countsTab(g, t.tier)).map(t => t.name);
  const S = g.goals.sum, ps = packStats(g) || {total:0, done:0, pct:0};
  let aPct = 0;
  if (S && ps.total && !ps.shelved) { let a = 0, w = 0, n = 0; for (const id of S.order) { const t = S.tabs[id]; if (t && t.n && countsTab(g, t.tier)) { a += ps.timed ? t.wa : t.a; w += ps.timed ? t.w : t.n; n += t.n; } } aPct = Math.round(a / (w || 1) * 100); }
  const dPct = Math.max(0, ps.pct - aPct);
  const exp = tab.expected;

  return `
    <div class="gsum">
      <div class="big">${ps.pct}<small>%</small></div>
      <div>
        <div class="gmeter" role="img" aria-label="${ps.pct}% of your finish line"><i style="width:${dPct}%"></i><i class="as" style="width:${aPct}%"></i></div>
        <p>${ps.shelved ? 'Shelved, so progress isn’t counted.' : ps.total ? `${ps.done} of ${ps.total} goals${ps.assumed ? `, ${ps.assumed} of them assumed` : ''}. ${ps.timed ? 'Weighted by estimated time.' : 'Counted per goal, since some goals have no time estimate yet.'}` : 'No goals on your finish line yet.'}</p>
      </div>
    </div>
    <div class="gfinish">
      <span class="lbl">Finish line</span>
      <div class="seg" role="tablist" aria-label="Finish line">${Object.keys(FINISH_LABEL).map(k => `<button class="${(g.finish || 'beat') === k ? 'on' : ''}" data-act="goal-finish" data-v="${k}">${FINISH_LABEL[k]}</button>`).join('')}</div>
      ${f === 'shelved' ? `<input type="text" data-f="goals.why" value="${esc(G.why)}" placeholder="Why shelve it? (optional)" aria-label="Why shelved">` : `<span class="lbl">Counting: ${counted.length ? esc(counted.join(', ')) : 'nothing yet'}</span>`}
    </div>
    ${p.man.note ? `<p class="gcover">${esc(p.man.note)}</p>` : ''}
    <div class="seg gtabs" role="tablist" aria-label="Goal tabs">${tabs.map(t => {
      const n = p.tabs[t.id].length, left = n - tcount(t.id);
      return `<button class="${V.tab === t.id && !searching ? 'on' : ''}" data-act="goal-tab" data-tab="${t.id}">${esc(t.name)}<span class="n">${n ? left : '—'}</span>${countsTab(g, t.tier) && n ? '<span class="dot" title="Counts toward your finish line"></span>' : ''}</button>`; }).join('')}</div>
    <div class="gtools">
      <input type="search" class="search" id="gsearch" placeholder="Search every tab" value="${esc(V.q)}" aria-label="Search goals in every tab">
      ${regions.length ? `<select id="gregion" aria-label="Region"><option value="">All regions</option>${regions.map(r => `<option value="${esc(r)}" ${V.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : ''}
      <div class="seg" role="tablist" aria-label="Show">${[['left', 'Left'], ['assumed', 'Assumed'], ['done', 'Done'], ['all', 'All']].map(([k, l]) => `<button class="${V.show === k ? 'on' : ''}" data-act="goal-show" data-v="${k}">${l}</button>`).join('')}</div>
      <button class="gmissbtn ${V.miss ? 'on' : ''}" data-act="goal-miss" aria-pressed="${V.miss}">Missables only</button>
      <span class="grow" style="flex:1"></span>
      <button class="btn quiet sm" data-act="goal-tools" aria-expanded="${V.tools}">Catch-up tools</button>
    </div>
    ${V.tools ? goalTools(g, p, tab, entries) : ''}
    ${!searching ? (entries.length
      ? `<p class="gcover"><b>${entries.length}</b> ${exp ? `of <b>${exp}</b> expected entries researched${entries.length < exp ? `, ${exp - entries.length} still to add` : ''}` : 'entries in this tab, and the real total isn’t counted yet'}.</p>`
      : `<p class="gcover">${exp ? `<b>0</b> of <b>${exp}</b> expected entries researched.` : 'Nothing researched for this tab yet.'}</p>`) : `<p class="gcover">Searching all tabs: <b>${total}</b> match${total === 1 ? '' : 'es'}.</p>`}
    ${shown.length ? `<section class="panel"><ul class="glist">${shown.map((e, i) => goalRow(g, e, {next:i < nextN, showTab:searching, tabName:tabName(e.tab)})).join('')}</ul>
      ${total > shown.length ? `<div class="gpager"><button class="btn quiet" data-act="goal-more">Show ${Math.min(GOAL_PAGE, total - shown.length)} more <span class="dim">&nbsp;(${total - shown.length} hidden)</span></button></div>` : ''}</section>`
      : `<div class="empty"><b>${!entries.length && !searching ? 'Nothing here yet' : V.show === 'left' && !q && !V.region && !V.miss ? 'Nothing left in this tab' : 'No matches'}</b>${!entries.length && !searching ? 'This tab fills in when the research pass runs for this game.' : 'Change the filters or search to see more.'}</div>`}`;
}

function secNews(g){

/* ---------- Render + navigation ---------- */
function render(){
  renderChrome();
  const g = view.gameId && game(view.gameId);
  if (view.gameId && !g) view.gameId = null;
  document.getElementById('app').innerHTML = g ? renderGame(g) : view.tab === 'continue' ? renderContinue() : view.tab === 'sync' ? renderSync() : renderLibrary();
  document.title = g ? `${g.title} · Game Log` : 'Game Log';
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
function go(fn){
  if (document.startViewTransition && !reduced.matches) document.startViewTransition(() => { fn(); render(); });
  else { fn(); render(); }
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

async function doArtSearch(){
  const a = view.art; if (!a || !a.q) return;
  a.loading = true; a.err = ''; render();
  try { a.results = await steamSearch(a.q); } catch(e) { a.err = `Search failed: ${e.message === 'Failed to fetch' ? 'couldn\'t reach the Worker' : e.message}`; }
  a.loading = false; if (view.art === a) render();
}
function setPath(obj, path, val){ const k = path.split('.'); let o = obj; while (k.length > 1) o = o[k.shift()]; o[k[0]] = val; }
function listFor(g, kind, layer){ return kind === 'miss' ? g.missables : g.layers[layer].items; }
function current(el){ return game((el && el.dataset.game) || view.gameId); }

function addItem(kind, layer){
  const g = current(); const id = `add-${kind}-${layer || 'x'}`, inp = document.getElementById(id);
  const text = inp.value.trim(); if (!text) return;
  listFor(g, kind, layer).push({id:uid(), text, done:false}); save(); render();
  const again = document.getElementById(id); if (again) again.focus();
}
function addGame(){
  const inp = document.getElementById('newTitle'); const t = inp.value.trim(); if (!t) { inp.focus(); return; }
  const g = blankGame(t); state.games.push(g); save();
  go(() => { view.gameId = g.id; view.section = 'quests'; }); window.scrollTo(0,0); toast(`Added ${t}`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'toggle') return; // checkbox: handled on change
  const g = current(el);
  switch (a) {
    case 'tab': go(() => { view.tab = el.dataset.tab; view.gameId = null; }); window.scrollTo(0,0);
      if (el.dataset.tab === 'sync' && Date.now() - (steamSum.fetched || 0) > 5 * 60000) fetchSummary();
      break;
    case 'open': view.art = null; vtId = el.dataset.id; document.querySelectorAll('.cover').forEach(c => c.style.viewTransitionName = ''); { const c = el.querySelector('.cover'); if (c) c.style.viewTransitionName = 'cv-' + vtId; } go(() => { view.gameId = el.dataset.id; view.section = el.dataset.section || 'save'; }); window.scrollTo(0,0); { const og = game(el.dataset.id); view.goals = null; if (og) { fetchAch(og); if (og.content) loadPack(og); } } break;
    case 'back': go(() => { view.gameId = null; }); window.scrollTo(0,0); break;
    case 'section': view.section = el.dataset.s; view.art = null; render(); if (el.dataset.s === 'achievements' && g) fetchAch(g); if (el.dataset.s === 'news' && g) enterNews(g); if (el.dataset.s === 'store' && g) { view.storeMore = false; fetchStore(g); } break;
    case 'filter': view.filter = el.dataset.f; render(); break;
    case 'goal': {
      const cur = goalSt(g, el.dataset.tab, el.dataset.id), before = stats(g).pct;
      setGoal(g, el.dataset.tab, el.dataset.id, cur === 'd' ? '' : 'd'); afterGoals(g);
      if (cur !== 'd' && before < 100 && stats(g).pct === 100) toast(`Finish line reached in ${g.title}`);
      break; }
    case 'goal-open': { const V = goalView(), k = el.dataset.tab + '\u0001' + el.dataset.id; if (V.open.has(k)) V.open.delete(k); else V.open.add(k); render(); break; }
    case 'goal-tab': { const V = goalView(); V.tab = el.dataset.tab; V.q = ''; V.limit = GOAL_PAGE; render(); break; }
    case 'goal-show': { const V = goalView(); V.show = el.dataset.v; V.limit = GOAL_PAGE; render(); break; }
    case 'goal-miss': { const V = goalView(); V.miss = !V.miss; V.limit = GOAL_PAGE; render(); break; }
    case 'goal-more': { const V = goalView(); V.limit += GOAL_PAGE; render(); break; }
    case 'goal-tools': { const V = goalView(); V.tools = !V.tools; render(); break; }
    case 'goal-retry': delete PACKS[g.content]; loadPack(g, true); render(); break;
    case 'goal-finish': g.finish = el.dataset.v; save(); render(); break;
    case 'goal-clear': setGoal(g, el.dataset.tab, el.dataset.id, ''); afterGoals(g); break;
    case 'goal-above': {
      const p = PACKS[g.content], list = p && p.tabs[el.dataset.tab]; if (!list) break;
      const at = list.findIndex(x => x.id === el.dataset.id);
      bulkGoals(g, 'Checkpoint', list.slice(0, Math.max(0, at)).filter(x => !goalSt(g, x.tab, x.id)).map(x => [x.tab, x.id, 'a'])); break; }
    case 'goal-sweep': {
      const p = PACKS[g.content], V = goalView(); if (!p) break;
      if (!V.swRegion) { toast('Pick a region first'); break; }
      const ids = V.swScope === 'all' ? p.man.tabs.map(t => t.id) : [V.tab];
      bulkGoals(g, `Swept ${V.swRegion}`, ids.flatMap(t => p.tabs[t]).filter(x => x.region === V.swRegion && !goalSt(g, x.tab, x.id)).map(x => [x.tab, x.id, 'a'])); break; }
    case 'goal-confirm-all': case 'goal-unassume': {
      const p = PACKS[g.content], V = goalView(); if (!p) break;
      const to = a === 'goal-confirm-all' ? 'd' : '';
      bulkGoals(g, to ? 'Confirmed assumed' : 'Cleared assumed', p.tabs[V.tab].filter(x => goalSt(g, x.tab, x.id) === 'a').map(x => [x.tab, x.id, to])); break; }
    case 'goal-undo': undoGoals(g); break;
    case 'ck-open': openCheckin(g, g.sessions[g.sessions.length - 1] || null, true); break;
    case 'ck-skip': closeCheckin(); break;
    case 'ck-save': saveCheckin(); break;
    case 'add-game': addGame(); break;
    case 'launch': toast('Opening in Steam\u2026'); watchLaunch(g); break; // the link itself does the launch
    case 'steam-import': importSteam(); break;
    case 'steam-import-all': importSteam(true); break;
    case 'ach-filter': view.achFilter = el.dataset.v; render(); break;
    case 'ach-refresh': fetchAch(g, {force:true}); break;
    case 'news-filter': view.newsFilter = el.dataset.v; render(); break;
    case 'news-refresh': fetchNews(g, {force:true}); break;
    case 'store-refresh': fetchStore(g, {force:true}); break;
    case 'store-play': playTrailer(el, g); break;
    case 'store-more': view.storeMore = !view.storeMore; render(); break;
    case 'store-track': {
      const n = el.dataset.name, d = el.dataset.date;
      if (!g.releases.some(r => sameRelease(r.name, n))) { g.releases.push({id:uid(), name:n, date:d}); save(); }
      render(); toast(`Tracking ${n}. It shows on your Continue screen`); break; }
    case 'ach-reveal': (view.reveal = view.reveal || new Set()).add(el.dataset.id); render(); break;
    case 'sync-save': {
      const u = document.getElementById('s-url').value.trim(), k = document.getElementById('s-key').value.trim();
      if (!/^https:\/\//.test(u) || !k) { setStatus(syncStatus, 'enter the Worker URL (starting with https://) and the sync key'); return; }
      sync.url = u; sync.key = k; saveSyncCfg(); syncStatus = 'idle'; render(); pull(); break; }
    case 'sync-now': pull(); break;
    case 'sync-off': sync = {}; saveSyncCfg(); syncStatus = 'off'; render(); toast('Sync turned off on this device'); break;
    case 'art-open':
      if (!syncOn()) { toast('Connect sync first. Cover search runs through your Worker'); return; }
      view.art = {q:g.title, results:null}; render(); doArtSearch(); break;
    case 'art-search': view.art.q = document.getElementById('artQ').value.trim(); doArtSearch(); break;
    case 'art-pick': applyArt(g, view.art.results[+el.dataset.i]); view.art = null; save(); render(); toast('Cover updated'); break;
    case 'art-clear': g.cover = ''; g.hero = ''; g.artTried = true; save(); render(); break;
    case 'tint': g.tint = +el.dataset.v; save(); render(); break;
    case 'rate': { const v = +el.dataset.v; g.rating = g.rating === v ? 0 : v; save(); render(); break; }
    case 'del': { const L = listFor(g, el.dataset.kind, el.dataset.layer); L.splice(L.findIndex(i => i.id === el.dataset.id), 1); save(); render(); break; }
    case 'add': addItem(el.dataset.kind, el.dataset.layer); break;
    case 'layer': g.layers[el.dataset.layer].inFinish = !g.layers[el.dataset.layer].inFinish; save(); render(); break;
    case 'played': g.lastPlayed = localDate(); g.lastPlayedAt = Date.now(); if (g.status === 'paused' || g.status === 'backlog') g.status = 'playing'; save(); render(); toast(`Logged a session of ${g.title}`); break;
    case 'add-rel': { const n = document.getElementById('relName').value.trim(), d = document.getElementById('relDate').value;
      if (!n || !d) { toast('Add a name and a date'); return; } g.releases.push({id:uid(), name:n, date:d}); save(); render(); break; }
    case 'del-rel': g.releases = g.releases.filter(r => r.id !== el.dataset.id); save(); render(); break;
    case 'delete-game': if (confirm(`Delete ${g.title}? This removes its quests, notes and score.`)) { state.games = state.games.filter(x => x.id !== g.id); save(); go(() => { view.gameId = null; }); toast(`Deleted ${g.title}`); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = `gamelog-backup-${localDate()}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('Backup downloaded'); break; }
    case 'import': document.getElementById('importFile').click(); break;
  }
});

// Hover preview for score pips
document.addEventListener('pointerover', e => {
  const p = e.target.closest('.pip'); if (!p) return;
  const row = p.parentElement, v = +p.dataset.v;
  row.querySelectorAll('.pip').forEach((x, i) => x.classList.toggle('hov', i < v));
});
document.addEventListener('pointerout', e => {
  const row = e.target.closest('.pip-row'); if (row && !row.contains(e.relatedTarget)) row.querySelectorAll('.pip').forEach(x => x.classList.remove('hov'));
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'sort') { view.sort = el.value; try { localStorage.setItem(SORT_KEY, view.sort); } catch(e) {} render(); return; }
  if (el.id === 'achSort') { view.achSort = el.value; render(); return; }
  if (el.id === 'gregion') { const V = goalView(); V.region = el.value; V.limit = GOAL_PAGE; render(); return; }
  if (el.id === 'gsw-region') { goalView().swRegion = el.value; return; }
  if (el.id === 'gsw-scope') { goalView().swScope = el.value; return; }
  const g = current(el); if (!g) return;
  if (el.dataset.goalnote) {
    const G = ensureGoals(g), v = el.value.trim().slice(0, 600);
    if (v) G.flag[el.dataset.goalnote] = v; else delete G.flag[el.dataset.goalnote];
    save(); render(); toast(v ? 'Flagged for the next data pass' : 'Flag removed'); return;
  }
  if (el.dataset.act === 'toggle' && el.dataset.kind === 'goal') {
    const before = stats(g).pct;
    setGoal(g, el.dataset.tab, el.dataset.id, el.checked ? 'd' : ''); afterGoals(g);
    if (el.checked && before < 100 && stats(g).pct === 100) toast(`Finish line reached in ${g.title}`);
    return;
  }
  if (el.dataset.act === 'toggle') {
    const it = listFor(g, el.dataset.kind, el.dataset.layer).find(i => i.id === el.dataset.id); it.done = el.checked; save();
    if (el.checked && stats(g).total && stats(g).pct === 100 && el.dataset.kind === 'item') toast(`Finish line reached in ${g.title}`);
    render(); return;
  }
  if (el.dataset.f && (el.dataset.rerender || el.dataset.rerenderBlur || el.type === 'date')) { setPath(g, el.dataset.f, el.value.trim ? el.value.trim() : el.value); save(); render(); }
});

let searchT;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { view.q = el.value; clearTimeout(searchT); searchT = setTimeout(() => { const cur = document.getElementById('search'); const pos = cur ? cur.selectionStart : view.q.length; render(); const s = document.getElementById('search'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }, 140); return; }
  if (el.id === 'gsearch') { const V = goalView(); V.q = el.value; V.limit = GOAL_PAGE; const pos = el.selectionStart; render(); const s = document.getElementById('gsearch'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } return; }
  const g = current(el);
  if (!g || !el.dataset.f || el.dataset.rerender || el.type === 'date') return;
  const val = el.dataset.num ? (parseFloat(el.value) || 0) : el.value;
  setPath(g, el.dataset.f, val); saveSoon();
  if (el.dataset.f === 'title') { const h = document.querySelector('.hero h1'); if (h) h.textContent = val; }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ckOpen) { closeCheckin(); return; }
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.id === 'newTitle') addGame();
  else if (el.dataset.enter === 'add') addItem(el.dataset.kind, el.dataset.layer);
  else if (el.id === 'artQ') document.querySelector('[data-act="art-search"]').click();
  else if (el.id === 'relName' || el.id === 'relDate') document.querySelector('[data-act="add-rel"]').click();
});

document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.games)) throw new Error('the file has no games list');
    if (confirm(`Replace your current library with ${s.games.length} games from this backup?`)) {
      state = migrate(s); state.seeded = state.seeded || {crimson:true}; save({touchAll:true}); view.gameId = null; render(); toast('Library restored');
    }
  } catch(err) { alert('Couldn\'t restore: ' + err.message + '. Pick a Game Log backup file.'); }
  e.target.value = '';
});

render();
pull();
loadIndex();
setInterval(() => { if (document.visibilityState === 'visible') pullPlay(); }, 60000);
setInterval(() => document.querySelectorAll('[data-sync-status]').forEach(el => el.textContent = syncText()), 30000);

/* ---------------- is there a newer copy? ---------------- */
/* 2026.10.21-a -> sortable; a two-letter suffix (after z) still sorts after one */
function buildKey(v){ const m=/^(\d{4})\.(\d\d)\.(\d\d)-([a-z]+)$/.exec(v||''); return m?m[1]+m[2]+m[3]+String(m[4].length)+m[4]:''; }
let UPD={last:0,dismissed:null,shown:null};
async function checkUpdate(force){
  if(!/^https?:$/.test(location.protocol) || !window.fetch) return;
  if(!force && Date.now()-UPD.last<90e3) return;
  UPD.last=Date.now();
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const html=await r.text();
    /* Compare build numbers, newer only: one update raises the bar once, even
       while GitHub's servers are still handing some requests the old copy. */
    const m=html.match(/v:'(\d{4}\.\d\d\.\d\d-[a-z]+)'/); if(!m) return;
    const live=m[1];
    if(!(buildKey(live)>buildKey(BUILD)) || live===UPD.dismissed) return;
    /* Just reloaded for this exact build and still got the old copy: GitHub
       hasn't caught up yet. Try again quietly in a minute instead of asking. */
    let tried=null; try{ tried=sessionStorage.getItem('gamelog_upd_tried'); }catch(e){}
    if(tried===live && !force){ setTimeout(()=>checkUpdate(true),60e3); return; }
    showUpdate(live);
  }catch(e){}
}
function showUpdate(ver){
  UPD.shown=ver;
  document.getElementById('updtxt').textContent='Build '+ver+' is ready';
  const b=document.getElementById('updbar'); b.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('up')));
}
document.getElementById('updgo').addEventListener('click',()=>{
  try{ sessionStorage.setItem('gamelog_upd_tried',UPD.shown||''); }catch(e){}
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  /* a query string the cache has never seen gets the live file; the next load
     cleans it off the address again */
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
});
document.getElementById('updx').addEventListener('click',()=>{
  UPD.dismissed=UPD.shown;
  const b=document.getElementById('updbar'); b.classList.remove('up'); setTimeout(()=>{ b.hidden=true; },320);
});
if(/[?&]v=\d+/.test(location.search)) try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
setTimeout(()=>checkUpdate(true),2500);
/* a tab that just stays open and visible never fires visibilitychange, so look again every two minutes */
setInterval(()=>{ if(document.visibilityState==='visible') checkUpdate(false); },120e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(false); });
</script>
